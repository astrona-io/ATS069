schema_version: 1
kind: question_bank
id: ats069-010
course_id: ATS069
exam_code: CBA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-010
  title: Build and run Backstage projects locally
questions:
- id: ats069-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain the responsibilities of the app and backend workspaces
  source_readings:
  - sections/section-010/module-01/course-01-workspaces-and-the-parts-of-a-project.md
  prompt: A portal page loads, but a deployment-status card shows a request failure.
    Which part must you inspect first?
  options:
  - id: a
    text: The app workspace build, because the page is part of it.
    explanation: The page loaded, so the app delivered its files. The failing request
      goes to the backend.
  - id: b
    text: The backend process and the route the card calls.
    explanation: Correct. The card calls a backend route, so the evidence is the requested
      route, the response status and the backend log.
  - id: c
    text: The root package, because it lists the workspaces.
    explanation: The root package only describes the workspaces and scripts. It serves
      nothing.
  - id: d
    text: The browser cache of the page.
    explanation: A cache can cause stale pages, but it does not explain a failed API
      request.
  correct_option: b
  explanation: The card calls a backend route, so the evidence is the requested route,
    the response status and the backend log.
- id: ats069-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Explain the responsibilities of the app and backend workspaces
  source_readings:
  - sections/section-010/module-01/course-01-workspaces-and-the-parts-of-a-project.md
  prompt: Which workspace may hold the credentials for an outside system, and why?
  options:
  - id: a
    text: The backend, because it runs on the server and the browser never receives
      its private configuration.
    explanation: Correct. The backend is a server process. Server-only values stay
      with it.
  - id: b
    text: The app, because it talks to the user.
    explanation: The app code is delivered to every browser, so a credential there
      is public.
  - id: c
    text: Either one, because both read app-config.yaml.
    explanation: Both read the files, but only the app block is meant for the browser.
  - id: d
    text: The root package, because it is private.
    explanation: A private package is only not published. It does not run anything.
  correct_option: a
  explanation: The backend is a server process. Server-only values stay with it.
- id: ats069-010-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the responsibilities of the app and backend workspaces
  source_readings:
  - sections/section-010/module-01/course-01-workspaces-and-the-parts-of-a-project.md
  prompt: A script in packages/backend/package.json uses --config app-config.yaml,
    and the file lives in the repository root. Running yarn workspace backend start
    fails to read the file. Why?
  options:
  - id: a
    text: Yarn does not support the --config option.
    explanation: The option belongs to the program in the script, not to Yarn.
  - id: b
    text: The root package.json must list the file in workspaces.
    explanation: The workspaces field lists package folders, not configuration files.
  - id: c
    text: Node.js cannot read YAML.
    explanation: Node.js can read any file. The program in the example parses the
      YAML itself.
  - id: d
    text: Yarn runs the script with the package folder as the working directory.
    explanation: Correct. The relative path resolves from packages/backend, where
      no such file exists. The script needs ../../app-config.yaml.
  correct_option: d
  explanation: The relative path resolves from packages/backend, where no such file
    exists. The script needs ../../app-config.yaml.
- id: ats069-010-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate startup failures by dependency, configuration and process
    boundaries
  source_readings:
  - sections/section-010/module-01/course-02-development-servers-and-configuration.md
  prompt: 'The backend prints: Missing required config value at ''backend.listen.port''
    and exits. A request to port 7007 is then refused. What is the cause of the refused
    request?'
  options:
  - id: a
    text: A firewall blocks port 7007.
    explanation: Nothing in the evidence points at a firewall. The process never listened.
  - id: b
    text: The frontend development server took the port.
    explanation: The frontend uses its own port. It would not stop the backend from
      printing this error.
  - id: c
    text: The process exited before it bound the port, because a required configuration
      key is missing.
    explanation: Correct. The configuration contract failed first, so the port was
      never bound. The refused connection is the symptom.
  - id: d
    text: Yarn cached an old port number.
    explanation: Yarn does not cache the port in this way. The key is simply absent.
  correct_option: c
  explanation: The configuration contract failed first, so the port was never bound.
    The refused connection is the symptom.
- id: ats069-010-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate startup failures by dependency, configuration and process
    boundaries
  source_readings:
  - sections/section-010/module-01/course-02-development-servers-and-configuration.md
  prompt: Which order of startup conditions is correct?
  options:
  - id: a
    text: Bind the port, load configuration, resolve packages, compile.
    explanation: The port is bound late, after the process has what it needs.
  - id: b
    text: Resolve packages, compile source, load configuration, bind the port.
    explanation: Correct. Each step needs the one before it, so the first failing
      step is the one to repair.
  - id: c
    text: Compile source, bind the port, resolve packages, load configuration.
    explanation: A process cannot bind its port before it has loaded its configuration.
  - id: d
    text: Load configuration, resolve packages, bind the port, compile.
    explanation: The code must exist and compile before the configuration is read.
  correct_option: b
  explanation: Each step needs the one before it, so the first failing step is the
    one to repair.
- id: ats069-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate startup failures by dependency, configuration and process
    boundaries
  source_readings:
  - sections/section-010/module-01/course-02-development-servers-and-configuration.md
  prompt: app-config.yaml is loaded first and app-config.production.yaml second, and
    both define environment. Which value does the backend use?
  options:
  - id: a
    text: The value from app-config.production.yaml.
    explanation: Correct. Later --config files win where they define the same key.
  - id: b
    text: The value from app-config.yaml.
    explanation: The base file is loaded first, so a later file overrides it.
  - id: c
    text: 'Neither: the backend stops with a conflict error.'
    explanation: Overriding is the normal way to layer configuration, not an error.
  - id: d
    text: The value that is longer.
    explanation: Length plays no role.
  correct_option: a
  explanation: Later --config files win where they define the same key.
- id: ats069-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the responsibilities of the app and backend workspaces
  source_readings:
  - sections/section-010/module-01/course-02-development-servers-and-configuration.md
  prompt: A developer puts an API token under the app block of the configuration so
    the frontend code can read it. What is the result?
  options:
  - id: a
    text: The token stays private because it is in a YAML file.
    explanation: A file on the server is private only if its content is not sent out.
      The app block is.
  - id: b
    text: The token is encrypted by the build.
    explanation: The build does not encrypt configuration values.
  - id: c
    text: The backend refuses to start.
    explanation: The backend does not check for this.
  - id: d
    text: The token is delivered to every browser that loads the page.
    explanation: Correct. Values in the browser-visible configuration are public to
      every user of the page.
  correct_option: d
  explanation: Values in the browser-visible configuration are public to every user
    of the page.
- id: ats069-010-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a development server from a production artifact
  source_readings:
  - sections/section-010/module-01/course-03-production-builds-and-artifacts.md
  prompt: yarn build:backend succeeds, and the development server works. Which check
    best shows that the artifact is ready to deploy?
  options:
  - id: a
    text: Run the development server again.
    explanation: The development server reads the source and hides missing build output.
  - id: b
    text: Count the lines in dist.
    explanation: Line counts show nothing about whether the files load.
  - id: c
    text: Run the built output alone with Node.js, without the source folder, using
      the target configuration.
    explanation: Correct. Only a run without the development path proves that the
      artifact holds every runtime file.
  - id: d
    text: Run yarn install again.
    explanation: Installing does not test the build output.
  correct_option: c
  explanation: Only a run without the development path proves that the artifact holds
    every runtime file.
- id: ats069-010-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Distinguish a development server from a production artifact
  source_readings:
  - sections/section-010/module-01/course-03-production-builds-and-artifacts.md
  prompt: You change a value that the browser reads in app-config.yaml. The development
    server shows the new value, but the built app still shows the old one. What explains
    this?
  options:
  - id: a
    text: The development server caches nothing and the build is broken.
    explanation: The development server reads the file at each start, which is expected.
      The build is not broken.
  - id: b
    text: The build wrote the configuration into the artifact when it ran, so the
      artifact needs a new build.
    explanation: Correct. The browser configuration is a snapshot made at build time.
      Build again to update it.
  - id: c
    text: Yarn ignores the file during production.
    explanation: Yarn does not decide which configuration an artifact contains.
  - id: d
    text: The browser rejects the new value.
    explanation: The browser shows what the artifact serves.
  correct_option: b
  explanation: The browser configuration is a snapshot made at build time. Build again
    to update it.
- id: ats069-010-q10
  type: single_choice
  difficulty: beginner
  learning_objective: "Describe what the project generator creates"
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: "A team runs npx @backstage/create-app@latest and later wants to know who maintains the generated root scripts. Who owns them?"
  options:
  - id: a
    text: "The Backstage project, which updates them with each release."
    explanation: "The generator copies a template once. It does not update files later."
  - id: b
    text: "The project owner, because the generator copies a template and does not manage it afterwards."
    explanation: "Correct. After generation every file belongs to the project owner."
  - id: c
    text: "Yarn, which regenerates them at install."
    explanation: "Yarn installs dependencies. It does not rewrite project scripts."
  - id: d
    text: "The npm registry, which serves the latest copy."
    explanation: "The registry serves packages, not the files of an existing project."
  correct_option: b
  explanation: "The generator copies a template once, so the project owner owns every file afterwards."
- id: ats069-010-q11
  type: single_choice
  difficulty: beginner
  learning_objective: "Describe what the project generator creates"
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: "Which folder holds the browser application in a generated project?"
  options:
  - id: a
    text: "plugins/app"
    explanation: "The plugins folder starts empty and holds plugins written by the team."
  - id: b
    text: "packages/backend"
    explanation: "This folder holds the backend process."
  - id: c
    text: "packages/app"
    explanation: "Correct. The frontend application is in packages/app."
  - id: d
    text: "examples"
    explanation: "This folder holds example catalog entities."
  correct_option: c
  explanation: "The frontend application is in packages/app and the backend is in packages/backend."
- id: ats069-010-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: "Describe what the project generator creates"
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: "A developer wants a configuration file for settings that belong to one machine only, such as a local token. Which approach matches the generated project?"
  options:
  - id: a
    text: "Edit app-config.production.yaml and commit it."
    explanation: "The production file is shared and committed."
  - id: b
    text: "Create app-config.local.yaml, which the generated .gitignore excludes, and pass it with --config."
    explanation: "Correct. The local file name is excluded from version control by convention."
  - id: c
    text: "Edit files under node_modules."
    explanation: "Yarn replaces node_modules at the next install."
  - id: d
    text: "Put the token in backstage.json."
    explanation: "backstage.json records the Backstage release."
  correct_option: b
  explanation: "A local configuration file that the .gitignore excludes keeps machine settings out of the repository."
- id: ats069-010-q13
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the main backstage-cli commands"
  source_readings:
  - sections/section-010/module-02/course-02-the-backstage-cli-commands.md
  prompt: "What is the difference between backstage-cli package build and backstage-cli repo build --all?"
  options:
  - id: a
    text: "The first builds one package and the second builds every package in the workspace."
    explanation: "Correct. Package commands have the scope of one package and repo commands work on the whole repository."
  - id: b
    text: "The first builds the frontend and the second builds the backend."
    explanation: "Both commands choose the build method from the role of each package."
  - id: c
    text: "The first builds for development and the second for production."
    explanation: "Neither command is tied to one environment."
  - id: d
    text: "There is no difference."
    explanation: "The scope differs."
  correct_option: a
  explanation: "Package commands work on one package. Repo commands work on every package."
- id: ats069-010-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: "Name the main backstage-cli commands"
  source_readings:
  - sections/section-010/module-02/course-02-the-backstage-cli-commands.md
  prompt: "Which command prints the configuration after all files named with --config are merged?"
  options:
  - id: a
    text: "backstage-cli package start"
    explanation: "This starts a package for development."
  - id: b
    text: "backstage-cli config:print"
    explanation: "Correct. It prints the merged configuration."
  - id: c
    text: "backstage-cli repo clean"
    explanation: "This removes build output."
  - id: d
    text: "backstage-cli versions:bump"
    explanation: "This upgrades Backstage packages."
  correct_option: b
  explanation: "config:print shows the merged configuration, which is the quickest way to see what a process will read."
- id: ats069-010-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: "Name the main backstage-cli commands"
  source_readings:
  - sections/section-010/module-02/course-02-the-backstage-cli-commands.md
  prompt: "A root script named build:all fails. A developer wants to know its scope. What does the developer do first?"
  options:
  - id: a
    text: "Assume it builds only the backend."
    explanation: "The script name is defined by the project, not by Backstage."
  - id: b
    text: "Read the script in package.json to see which backstage-cli command it calls."
    explanation: "Correct. The command and its options give the scope."
  - id: c
    text: "Delete node_modules."
    explanation: "This does not explain the scope."
  - id: d
    text: "Run backstage-cli repo clean."
    explanation: "This removes output and does not explain the script."
  correct_option: b
  explanation: "A script name is project-defined, so read the command it runs."
- id: ats069-010-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain what the backstage.role field controls"
  source_readings:
  - sections/section-010/module-02/course-03-package-roles-and-the-workspace-layout.md
  prompt: "A new plugin folder plugins/billing is created by hand. yarn workspaces list does not show it. What is the most likely cause?"
  options:
  - id: a
    text: "The plugin has no tests."
    explanation: "Tests do not decide whether Yarn lists a workspace."
  - id: b
    text: "The workspaces field in the root package.json has no pattern that matches plugins/billing."
    explanation: "Correct. A folder that no pattern matches is invisible to Yarn."
  - id: c
    text: "The plugin role is frontend."
    explanation: "The role does not decide whether Yarn lists a workspace."
  - id: d
    text: "Node.js is too new."
    explanation: "The Node.js version does not remove a folder from the list."
  correct_option: b
  explanation: "Yarn lists only folders that a workspaces pattern matches."
- id: ats069-010-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain what the backstage.role field controls"
  source_readings:
  - sections/section-010/module-02/course-03-package-roles-and-the-workspace-layout.md
  prompt: "What does the backstage.role field of a package.json tell backstage-cli?"
  options:
  - id: a
    text: "The release of Backstage that the package supports."
    explanation: "That is recorded in backstage.json."
  - id: b
    text: "How to build, start and publish the package, and which dependency directions are allowed."
    explanation: "Correct. The role selects the method of the build tool."
  - id: c
    text: "Which port the package listens on."
    explanation: "Ports are set in configuration files."
  - id: d
    text: "Which users may open the package."
    explanation: "Roles are not permissions."
  correct_option: b
  explanation: "The role tells the tool how to build, start and publish the package."
- id: ats069-010-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: "Check that the Node.js and Yarn versions match"
  source_readings:
  - sections/section-010/module-02/course-04-node-js-yarn-and-version-alignment.md
  prompt: "Which field and tool make every developer use the same Yarn version?"
  options:
  - id: a
    text: "engines.node and nvm."
    explanation: "engines.node describes Node.js."
  - id: b
    text: "packageManager in the root package.json, read by Corepack."
    explanation: "Correct. Corepack runs exactly the Yarn version that the field names."
  - id: c
    text: "backstage.json and npm."
    explanation: "backstage.json records the Backstage release."
  - id: d
    text: "workspaces and Docker."
    explanation: "These do not pin Yarn."
  correct_option: b
  explanation: "The packageManager field, together with Corepack, pins the Yarn version."
- id: ats069-010-q19
  type: single_choice
  difficulty: advanced
  learning_objective: "Check that the Node.js and Yarn versions match"
  source_readings:
  - sections/section-010/module-02/course-04-node-js-yarn-and-version-alignment.md
  prompt: "After a manual upgrade of one @backstage/* package, the build reports a missing export. What is the right repair?"
  options:
  - id: a
    text: "Upgrade every other package to latest by hand."
    explanation: "Versions are released as a tested set, so manual guessing repeats the problem."
  - id: b
    text: "Run backstage-cli versions:bump so that all @backstage/* packages move to one matching release."
    explanation: "Correct. The packages are tested together."
  - id: c
    text: "Delete backstage.json."
    explanation: "The file is only a record."
  - id: d
    text: "Change the engines field."
    explanation: "The Node.js range does not cause a missing export."
  correct_option: b
  explanation: "A mixed set of @backstage/* versions is repaired by upgrading the whole set with versions:bump."
- id: ats069-010-q20
  type: single_choice
  difficulty: beginner
  learning_objective: "Explain the roles of ports 3000 and 7007"
  source_readings:
  - sections/section-010/module-03/course-01-ports-base-urls-and-cors.md
  prompt: "Which two origins are different for a browser?"
  options:
  - id: a
    text: "http://localhost:3000 and http://localhost:3000/catalog"
    explanation: "Only the path differs, so the origin is the same."
  - id: b
    text: "http://localhost:3000 and http://localhost:7007"
    explanation: "Correct. The port is part of the origin."
  - id: c
    text: "http://localhost:7007/api and http://localhost:7007/healthcheck"
    explanation: "Only the path differs."
  - id: d
    text: "http://localhost:3000 and http://localhost:3000?x=1"
    explanation: "Only the query differs."
  correct_option: b
  explanation: "An origin is scheme, host and port, so a different port is a different origin."
- id: ats069-010-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain the roles of ports 3000 and 7007"
  source_readings:
  - sections/section-010/module-03/course-01-ports-base-urls-and-cors.md
  prompt: "The app loads, but every card shows a network error. The browser developer tools report a CORS error for requests to port 7007. Which value is the first to check?"
  options:
  - id: a
    text: "backend.database.client"
    explanation: "The database does not decide CORS answers."
  - id: b
    text: "backend.cors.origin, which must equal app.baseUrl"
    explanation: "Correct. The backend must allow the origin of the app."
  - id: c
    text: "catalog.locations"
    explanation: "Locations decide catalog data, not CORS."
  - id: d
    text: "auth.environment"
    explanation: "This decides the sign-in mode."
  correct_option: b
  explanation: "CORS errors are decided by backend.cors, whose origin must match the app origin exactly."
- id: ats069-010-q22
  type: single_choice
  difficulty: beginner
  learning_objective: "Compare the SQLite database of a local start with a PostgreSQL database"
  source_readings:
  - sections/section-010/module-03/course-02-databases-sqlite-and-postgresql.md
  prompt: "What happens to data stored in SQLite with the connection ':memory:' when the backend stops?"
  options:
  - id: a
    text: "It is saved to a file in packages/backend."
    explanation: "The memory connection does not write a file."
  - id: b
    text: "It is lost, because it lived in the memory of the process."
    explanation: "Correct. Catalog data from locations loads again at the next start."
  - id: c
    text: "It moves to PostgreSQL."
    explanation: "No migration happens."
  - id: d
    text: "It stays in the browser."
    explanation: "The database belongs to the backend."
  correct_option: b
  explanation: "In-memory SQLite data is lost when the process stops."
- id: ats069-010-q23
  type: single_choice
  difficulty: intermediate
  learning_objective: "Compare the SQLite database of a local start with a PostgreSQL database"
  source_readings:
  - sections/section-010/module-03/course-02-databases-sqlite-and-postgresql.md
  prompt: "Where should the PostgreSQL password be stored for a team project?"
  options:
  - id: a
    text: "As a literal value in app-config.yaml."
    explanation: "It would enter the repository."
  - id: b
    text: "As a ${POSTGRES_PASSWORD} substitution, with the value in the process environment."
    explanation: "Correct. The secret stays out of the committed file."
  - id: c
    text: "In the frontend configuration."
    explanation: "The browser would receive it."
  - id: d
    text: "In catalog-info.yaml."
    explanation: "This file describes the project as an entity."
  correct_option: b
  explanation: "Use the substitution syntax and set the variable in the environment."
- id: ats069-010-q24
  type: single_choice
  difficulty: advanced
  learning_objective: "Compare the SQLite database of a local start with a PostgreSQL database"
  source_readings:
  - sections/section-010/module-03/course-02-databases-sqlite-and-postgresql.md
  prompt: "The backend stops at start with a PostgreSQL permission error while creating a database named backstage_plugin_catalog. What does this show?"
  options:
  - id: a
    text: "The user lacks the permission to create databases, because each plugin gets its own database."
    explanation: "Correct. The error comes from PostgreSQL about the user permissions."
  - id: b
    text: "The catalog location file is missing."
    explanation: "A missing location does not stop the backend."
  - id: c
    text: "The CORS origin is wrong."
    explanation: "CORS is a browser check."
  - id: d
    text: "The guest provider is disabled."
    explanation: "Sign-in does not create databases."
  correct_option: a
  explanation: "Each plugin database is created by the configured user, which needs the permission to create databases."
- id: ats069-010-q25
  type: single_choice
  difficulty: intermediate
  learning_objective: "Enable guest sign-in for development and explain why it stays out of production"
  source_readings:
  - sections/section-010/module-03/course-03-guest-sign-in-and-secret-values.md
  prompt: "Why must auth.providers.guest not be defined in the production configuration?"
  options:
  - id: a
    text: "Because it slows the backend."
    explanation: "Speed is not the reason."
  - id: b
    text: "Because it signs every visitor in without a password and is meant for development only."
    explanation: "Correct. Production needs a real identity provider."
  - id: c
    text: "Because YAML does not allow it."
    explanation: "The syntax is valid."
  - id: d
    text: "Because it needs PostgreSQL."
    explanation: "It does not depend on the database."
  correct_option: b
  explanation: "The guest provider signs everyone in without a password, so it belongs only in development."
