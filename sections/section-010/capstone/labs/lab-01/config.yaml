# Build And Run Backstage Projects Locally (CAPSTONE). Graded on the virtual machine.
# The workspace /opt/portal starts with four faults across start, build and configuration.
metadata:
  name: "ats-069-capstone-010-01"
  docs:
    question: "question.md"
    solution: "solution.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 4096
      diskSizeGB: 20
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "seed-portal"
      description: "Install Node.js and Yarn, then create the workspace with its faults"
      type: "folder"
      source: "bootstrap/"

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: "apply-solution"
      description: "Apply the reference solution"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "backend-starts-from-source"
      description: "The backend starts from source and answers the health check on port 7007"
      type: "file"
      source: "validation/validate-backend-starts-from-source.sh"
      hint: "A package script runs from the package directory. Fix the --config path in packages/backend/package.json."
    - name: "app-starts-on-3000"
      description: "The app development server answers on port 3000"
      type: "file"
      source: "validation/validate-app-starts-on-3000.sh"
      hint: "The app server takes its port from app.baseUrl. Make it http://localhost:3000."
    - name: "secret-not-browser-visible"
      description: "The browser-visible configuration does not contain the GitHub token, and the backend still has it"
      type: "file"
      source: "validation/validate-secret-not-browser-visible.sh"
      hint: "Everything under app is sent to the browser. Move githubToken under backend."
    - name: "build-all-builds-both"
      description: "yarn build:all produces dist for the app and the backend"
      type: "file"
      source: "validation/validate-build-all-builds-both.sh"
      hint: "build:all must run the build script of every workspace. yarn workspaces foreach --all run build does that."
    - name: "artifacts-run-alone"
      description: "Both built artifacts run without src and without a config.json leak"
      type: "file"
      source: "validation/validate-artifacts-run-alone.sh"
      hint: "Run yarn build:all after the configuration is fixed, so dist/config.json is generated from the corrected files."

teardown:
  keepCluster: false
