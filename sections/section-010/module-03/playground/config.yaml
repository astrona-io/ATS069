# Database, Ports, Proxies And Local Integrations (PLAYGROUND).
# A working example configuration workspace in /opt/envcfg. No task, no grading, no astrona submit.
metadata:
  name: "ats-069-playground-010-03"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 4096
      diskSizeGB: 20
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "seed-envcfg"
      description: "Install Node.js and Yarn, then create the example configuration workspace"
      type: "folder"
      source: "bootstrap/"
  manifests: []

teardown:
  keepCluster: false
