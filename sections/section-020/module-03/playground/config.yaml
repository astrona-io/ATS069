# Testing, Linting And Formatting Workflow (PLAYGROUND). A portal workspace with a check script and a Git hook in /opt/portal.
# No task, no grading, no astrona submit. UNTESTED.
metadata:
  name: "ats-069-playground-020-03"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 4096
      diskSizeGB: 20
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "prepare-checks"
      description: "Install Node.js 22 and Yarn, then create the checked workspace in /opt/portal"
      type: "folder"
      source: "bootstrap/"
  manifests: []

teardown:
  keepCluster: false
