    text: "The install step; delete the lockfile."
    explanation: "Deleting the lockfile makes the install unrepeatable and is not the first move."
  - id: c
    text: "The build step; run the same root build script the pipeline runs, from a clean state with `dist` folders removed."
    explanation: "Correct. A resolution failure belongs to the build, and the script keeps the flags the same as the pipeline."
