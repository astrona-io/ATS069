# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats069-030
course_id: ATS069
exam_code: CBA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-030
  title: Compile a Backstage project with TypeScript
questions:
- id: ats069-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish type checking, emit and bundling
  source_readings:
  - sections/section-030/module-01/course-01-checking-emitting-and-tsconfig-scope.md
  prompt: A pipeline step runs `tsc --noEmit` in the repository root and ends with
    exit code 0. What does this result show?
  options:
  - id: a
    text: The compiler found no type error in the files covered by the project, and
      wrote no files.
    explanation: Correct. Exit code 0 with `noEmit` means no errors for the files
      in scope. Nothing was emitted or bundled.
  - id: b
    text: The backend package builds and starts without error.
    explanation: Starting a backend needs configuration and runtime dependencies,
      which a type check does not touch.
  - id: c
    text: Every package in the workspace has current declaration files.
    explanation: "`noEmit` writes no files, so no declaration file was created."
  - id: d
    text: The browser bundle contains no unused code.
    explanation: Bundling is done by another tool, not by `tsc`.
  correct_option: a
  explanation: Exit code 0 with `noEmit` means no errors for the files in scope. Nothing
    was emitted or bundled.
- id: ats069-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain how include patterns decide the scope of a check
  source_readings:
  - sections/section-030/module-01/course-01-checking-emitting-and-tsconfig-scope.md
  prompt: 'The root `tsconfig.json` has `"include": ["packages/*/src"]`. A plugin
    in `plugins/deploy-backend/src` has a type error and no file under `packages`
    imports it. What does `tsc -p tsconfig.json` do?'
  options:
  - id: a
    text: It reports the error, because tsc scans the whole repository.
    explanation: "`tsc` only reads the files that the project selects and the files
      they import."
  - id: b
    text: It reports no error for that plugin, because the file is not part of the
      project.
    explanation: Correct. The plugin is neither matched by `include` nor imported
      by a matched file, so it is outside the check.
  - id: c
    text: It fails with a configuration error about the unmatched folder.
    explanation: An `include` pattern that matches fewer folders is valid and raises
      no error.
  - id: d
    text: It reports the error only when `strict` is turned off.
    explanation: "`strict` makes the compiler stricter and does not change which files
      are read."
  correct_option: b
  explanation: The plugin is neither matched by `include` nor imported by a matched
    file, so it is outside the check.
- id: ats069-030-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Use tsc options to see what a result covers
  source_readings:
  - sections/section-030/module-01/course-01-checking-emitting-and-tsconfig-scope.md
  prompt: A reviewer doubts that a green `tsc` run covered a new plugin. Which command
    shows directly which files the project contains?
  options:
  - id: a
    text: "`yarn install`, which prints the list of compiler inputs."
    explanation: A package manager install does not list compiler inputs.
  - id: b
    text: "`tsc -p tsconfig.json --listFilesOnly`"
    explanation: Correct. `--listFilesOnly` prints each file of the project and stops,
      so a missing plugin file is visible.
  - id: c
    text: "`tsc --build --clean`"
    explanation: "`--clean` deletes build output and does not list inputs."
  - id: d
    text: "`node --check tsconfig.json`"
    explanation: "`node --check` checks JavaScript syntax and does not read project
      settings."
  correct_option: b
  explanation: "`--listFilesOnly` prints each file of the project and stops, so a
    missing plugin file is visible."
- id: ats069-030-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Handle an optional property without hiding the error
  source_readings:
  - sections/section-030/module-01/course-02-types-optional-values-and-runtime-boundaries.md
  prompt: 'The type has `owner?: string`. The code `record.owner.toUpperCase()` is
    reported by the compiler. Which change removes the crash path at runtime?'
  options:
  - id: a
    text: "`(record.owner as string).toUpperCase()`"
    explanation: An assertion emits no code, so a record without an owner still throws.
  - id: b
    text: "`record.owner!.toUpperCase()`"
    explanation: The non-null operator also emits no code and keeps the crash path.
  - id: c
    text: '`record.owner === undefined ? "unassigned" : record.owner.toUpperCase()`'
    explanation: Correct. The code decides what a missing owner means and narrows
      the type inside the other branch.
  - id: d
    text: Turn off `strict` in `tsconfig.json`.
    explanation: Turning off `strict` hides the error for every file and changes nothing
      at runtime.
  correct_option: c
  explanation: The code decides what a missing owner means and narrows the type inside
    the other branch.
- id: ats069-030-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why types do not validate external data
  source_readings:
  - sections/section-030/module-01/course-02-types-optional-values-and-runtime-boundaries.md
  prompt: A backend handler uses `const record = JSON.parse(body) as DeploymentRecord`.
    A client sends `{"id":"a","status":"done"}`. What happens?
  options:
  - id: a
    text: The compiler rejects the program because `done` is not a valid status.
    explanation: The compiler never sees the request body, so it cannot reject it.
  - id: b
    text: The handler throws at the `as` expression.
    explanation: An assertion emits no code, so nothing throws there.
  - id: c
    text: The assertion compiles and runs, and the record has a status that the type
      does not allow.
    explanation: Correct. The compiler trusts the assertion and nothing checks the
      data when it arrives.
  - id: d
    text: TypeScript adds a runtime check for the declared type.
    explanation: TypeScript removes all types from the emitted JavaScript.
  correct_option: c
  explanation: The compiler trusts the assertion and nothing checks the data when
    it arrives.
- id: ats069-030-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Choose the right place for a runtime check
  source_readings:
  - sections/section-030/module-01/course-02-types-optional-values-and-runtime-boundaries.md
  prompt: Where should the check that a JSON body has a valid `status` live?
  options:
  - id: a
    text: In a type alias next to the `DeploymentRecord` interface.
    explanation: A type alias is removed during emit and cannot check a value.
  - id: b
    text: At the edge where the data enters, in a function that takes `unknown` and
      returns a typed record.
    explanation: Correct. The function turns untrusted data into a typed record or
      throws, and the compiler checks the code behind it.
  - id: c
    text: In `tsconfig.json`, with the option `strict`.
    explanation: "`strict` changes compile-time rules and has no effect on incoming
      data."
  - id: d
    text: In the build script, with `tsc --build`.
    explanation: A build runs before the program and never sees runtime data.
  correct_option: b
  explanation: The function turns untrusted data into a typed record or throws, and
    the compiler checks the code behind it.
- id: ats069-030-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain project references and build order
  source_readings:
  - sections/section-030/module-01/course-03-workspace-builds-references-and-declarations.md
  prompt: "`deploy-backend` imports types from `deploy-common`, but its `tsconfig.json`
    has no `references`. On a machine with old output the build passes. On a clean
    machine it fails. Why?"
  options:
  - id: a
    text: "`deploy-common` is a plugin, and plugins cannot be built on a clean machine."
    explanation: Any package can be built; the problem is the missing dependency declaration.
  - id: b
    text: The missing reference is not declared, so a clean build has no declaration
      output of `deploy-common` to read and no order to build it first.
    explanation: Correct. References give the compiler the order and the declaration
      files that a project needs; old output only hid the gap.
  - id: c
    text: "`tsc` ignores `paths` mappings on clean machines."
    explanation: The `paths` mapping works the same way on every machine.
  - id: d
    text: Old output makes `strict` checks pass.
    explanation: "`strict` does not depend on output files."
  correct_option: b
  explanation: References give the compiler the order and the declaration files that
    a project needs; old output only hid the gap.
- id: ats069-030-q08
  type: single_choice
  difficulty: advanced
  learning_objective: Separate the layers that own a failure
  source_readings:
  - sections/section-030/module-01/course-03-workspace-builds-references-and-declarations.md
  prompt: The Backstage command-line build of a package succeeds, and the root type
    check reports an incompatible property in the same package. What follows?
  options:
  - id: a
    text: The build proves the types are correct, so the type check is wrong.
    explanation: The build does not check types, so its success says nothing about
      them.
  - id: b
    text: 'The two steps are separate: the build transpiles without checking types,
      so the type error is real and needs a source fix.'
    explanation: Correct. Building and type checking are separate pieces of evidence,
      and the type check owns this finding.
  - id: c
    text: The build must be run again with `--clean` to remove the error.
    explanation: A clean build does not change a type error in source.
  - id: d
    text: The type error can only be a network problem.
    explanation: A type error comes from declarations and callers, not from the network.
  correct_option: b
  explanation: Building and type checking are separate pieces of evidence, and the
    type check owns this finding.
- id: ats069-030-q09
  type: single_choice
  difficulty: beginner
  learning_objective: "Explain what a shared base tsconfig sets"
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: "A root `tsconfig.json` has `\"extends\": \"./tsconfig.base.json\"` and does not mention `strict`. The base sets `strict` to `true`. What is the value of `strict` for the root project?"
  options:
  - id: a
    text: "`false`, because an option that is not set defaults to off."
    explanation: "A default applies only when no file in the chain sets the option. The base sets it."
  - id: b
    text: "`true`, because options the extending file does not set keep the value from the base."
    explanation: "Correct. Options that the extending file does not mention are inherited from the base."
  - id: c
    text: "The compiler stops with an error, because every option must appear in the root file."
    explanation: "The root file does not need to repeat inherited options."
  - id: d
    text: "It depends on the operating system."
    explanation: "Inheritance through `extends` does not depend on the operating system."
  correct_option: b
  explanation: "Options that the extending file does not mention are inherited from the base."
- id: ats069-030-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read the merged configuration"
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: "Which command prints the compiler options that really apply to a project after `extends` is resolved?"
  options:
  - id: a
    text: "`tsc --showConfig`"
    explanation: "Correct. It prints the configuration after the whole `extends` chain is merged."
  - id: b
    text: "`tsc --listFilesOnly`"
    explanation: "It lists the files of the project and does not print the options."
  - id: c
    text: "`tsc --noEmit`"
    explanation: "It stops the compiler from writing output and prints no configuration."
  - id: d
    text: "`npm ls typescript`"
    explanation: "It lists the installed package version and does not show the options."
  correct_option: a
  explanation: "It prints the configuration after the whole `extends` chain is merged."
- id: ats069-030-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain precedence between a base and an extending file"
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: "The base file has `\"include\": [\"packages/*/src\"]`. A file that extends it sets `\"include\": [\"plugins/*/src\"]`. Which files does the extending project include?"
  options:
  - id: a
    text: "The files under both patterns, because the lists are merged."
    explanation: "`include`, `exclude` and `files` are replaced, not merged."
  - id: b
    text: "Only the files under `packages/*/src`, because the base always wins."
    explanation: "The extending file wins for the fields it sets."
  - id: c
    text: "No files, because two `include` fields conflict."
    explanation: "Two files setting `include` do not conflict; the nearest one is used."
  - id: d
    text: "Only the files under `plugins/*/src`, because the list is replaced and not merged."
    explanation: "Correct. The `include` field of the extending file replaces the one from the base as a whole."
  correct_option: d
  explanation: "The `include` field of the extending file replaces the one from the base as a whole."
- id: ats069-030-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain what strict switches on"
  source_readings:
  - sections/section-030/module-02/course-02-strict-mode-and-what-it-switches-on.md
  prompt: "What does the option `strict` change about the compiler output?"
  options:
  - id: a
    text: "It removes all types from the output."
    explanation: "Types are removed from JavaScript output whether or not `strict` is on."
  - id: b
    text: "It makes the compiler write minified files."
    explanation: "Minification is not part of `strict`."
  - id: c
    text: "Nothing. It only changes which problems the compiler reports."
    explanation: "Correct. `strict` turns on more checks. The written JavaScript or declarations do not depend on it."
  - id: d
    text: "It makes the compiler run tests."
    explanation: "The compiler does not run tests."
  correct_option: c
  explanation: "`strict` turns on more checks. The written JavaScript or declarations do not depend on it."
- id: ats069-030-q13
  type: single_choice
  difficulty: beginner
  learning_objective: "Name checks inside strict"
  source_readings:
  - sections/section-030/module-02/course-02-strict-mode-and-what-it-switches-on.md
  prompt: "A function `function double(value) { return value * 2; }` passes without `strict` and fails with it. Which check reports the error?"
  options:
  - id: a
    text: "`strictPropertyInitialization`, which checks class properties."
    explanation: "The function has no class property."
  - id: b
    text: "`noImplicitAny`, because the parameter would get the type `any` by guessing."
    explanation: "Correct. Under `strict`, `noImplicitAny` rejects a value whose type is implicitly `any`."
  - id: c
    text: "`alwaysStrict`, which adds `\"use strict\"`."
    explanation: "It changes the emitted directive, not the type of a parameter."
  - id: d
    text: "`useUnknownInCatchVariables`, which types catch variables."
    explanation: "The function has no `catch` clause."
  correct_option: b
  explanation: "Under `strict`, `noImplicitAny` rejects a value whose type is implicitly `any`."
- id: ats069-030-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: "Handle an optional value under strictNullChecks"
  source_readings:
  - sections/section-030/module-02/course-02-strict-mode-and-what-it-switches-on.md
  prompt: "`record.owner` has the type `string | undefined`. Under `strict`, `record.owner.toUpperCase()` is an error. Which change solves it without weakening the check?"
  options:
  - id: a
    text: "Test for `undefined` before calling the method, for example with a conditional expression."
    explanation: "Correct. Handling the missing value in code removes the crash path that the compiler found."
  - id: b
    text: "Set `strict` to `false` in the package configuration."
    explanation: "This hides the report and keeps the crash path."
  - id: c
    text: "Add `// @ts-ignore` above the line."
    explanation: "The comment makes the compiler skip the line and the crash path remains."
  - id: d
    text: "Write `record.owner as any`."
    explanation: "`any` turns off checking for that value and still crashes on `undefined`."
  correct_option: a
  explanation: "Handling the missing value in code removes the crash path that the compiler found."
- id: ats069-030-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain skipLibCheck"
  source_readings:
  - sections/section-030/module-02/course-03-skiplibcheck-and-declaration-files.md
  prompt: "A repository has `skipLibCheck: true`. A `.d.ts` file written by the team contains a reference to a type that does not exist. What does `tsc` report?"
  options:
  - id: a
    text: "Error `TS2304`, because the team owns the file."
    explanation: "`skipLibCheck` does not make an exception for files the team owns."
  - id: b
    text: "A warning that does not change the exit code."
    explanation: "The compiler has no warning level for this case."
  - id: c
    text: "An error only for imports of that file."
    explanation: "The file is skipped for checking regardless of who imports it."
  - id: d
    text: "Nothing for that file, because `skipLibCheck` skips all declaration files, including the team's own."
    explanation: "Correct. The option applies to every `.d.ts` file in the project."
  correct_option: d
  explanation: "The option applies to every `.d.ts` file in the project."
- id: ats069-030-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read the full check script"
  source_readings:
  - sections/section-030/module-02/course-03-skiplibcheck-and-declaration-files.md
  prompt: "The script `tsc:full` runs `tsc --skipLibCheck false --incremental false`. Why does a repository keep it next to the everyday `tsc` script?"
  options:
  - id: a
    text: "It writes the JavaScript files for the build."
    explanation: "The script only runs the type check."
  - id: b
    text: "It installs dependencies before the check."
    explanation: "Installing is the job of the package manager."
  - id: c
    text: "It checks declaration files too and starts from nothing, so it reports errors that the everyday check hides."
    explanation: "Correct. Both flags remove shortcuts of the everyday check."
  - id: d
    text: "It runs faster than the everyday check."
    explanation: "Removing the shortcuts makes it slower."
  correct_option: c
  explanation: "Both flags remove shortcuts of the everyday check."
- id: ats069-030-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain where declarations go"
  source_readings:
  - sections/section-030/module-02/course-04-check-scripts-dist-types-and-incremental-checks.md
  prompt: "The base sets `declaration` and `emitDeclarationOnly`, and the root file sets `outDir` to `dist-types`. What does `yarn tsc` write?"
  options:
  - id: a
    text: "JavaScript files next to each source file."
    explanation: "`outDir` moves the output and `emitDeclarationOnly` removes the JavaScript."
  - id: b
    text: "Declaration files in `dist-types` and no JavaScript."
    explanation: "Correct. `emitDeclarationOnly` limits the output to `.d.ts` files, and `outDir` sends them to `dist-types`."
  - id: c
    text: "Nothing, because the check never writes files."
    explanation: "With these options the check writes declaration files."
  - id: d
    text: "A bundle for the browser."
    explanation: "`tsc` does not bundle."
  correct_option: b
  explanation: "`emitDeclarationOnly` limits the output to `.d.ts` files, and `outDir` sends them to `dist-types`."
- id: ats069-030-q18
  type: single_choice
  difficulty: advanced
  learning_objective: "Explain incremental mode and the build order"
  source_readings:
  - sections/section-030/module-02/course-04-check-scripts-dist-types-and-incremental-checks.md
  prompt: "A pipeline runs `yarn build:all` before `yarn tsc` and the library build fails on a clean machine, but passes on a developer machine. What is the most likely cause?"
  options:
  - id: a
    text: "The library build reads declarations from `dist-types`, which exist on the developer machine from earlier runs and not on the clean machine."
    explanation: "Correct. The type check writes the declarations that the library build needs, so it must run first."
  - id: b
    text: "`strict` is on only on the clean machine."
    explanation: "`strict` comes from the shared configuration and is the same on both machines."
  - id: c
    text: "`skipLibCheck` is off on the developer machine."
    explanation: "The option does not decide whether `dist-types` exists."
  - id: d
    text: "The clean machine has no network connection to the compiler."
    explanation: "The compiler is installed locally and does not use the network to check."
  correct_option: a
  explanation: "The type check writes the declarations that the library build needs, so it must run first."
- id: ats069-030-q19
  type: single_choice
  difficulty: beginner
  learning_objective: "Explain package roles"
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: "Which field of `package.json` tells `backstage-cli` what kind of package it is building?"
  options:
  - id: a
    text: "`main`"
    explanation: "`main` names the entry file of the package."
  - id: b
    text: "`files`"
    explanation: "`files` lists what a published package contains."
  - id: c
    text: "`private`"
    explanation: "`private` blocks publishing and says nothing about the kind of package."
  - id: d
    text: "`backstage.role`"
    explanation: "Correct. The role names the kind of package, for example `frontend` or `backend-plugin`."
  correct_option: d
  explanation: "The role names the kind of package, for example `frontend` or `backend-plugin`."
- id: ats069-030-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: "Choose the right role"
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: "A package holds shared types and helper functions that both the browser app and the backend import, and it uses no Node.js-only API. Which role fits?"
  options:
  - id: a
    text: "`node-library`"
    explanation: "It is meant for code that runs on Node.js only."
  - id: b
    text: "`web-library`"
    explanation: "It is meant for code that runs in the browser only."
  - id: c
    text: "`common-library`"
    explanation: "Correct. A library that can run in both places is a `common-library`."
  - id: d
    text: "`backend`"
    explanation: "It is the backend application, not a library."
  correct_option: c
  explanation: "A library that can run in both places is a `common-library`."
- id: ats069-030-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain the effect of a missing role"
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: "A package has no `backstage.role`. What is the consequence?"
  options:
  - id: a
    text: "Nothing, because the role is only documentation."
    explanation: "The tooling reads the role."
  - id: b
    text: "The tooling cannot tell which build and rules to use, so the package is not built correctly."
    explanation: "Correct. The role is how the tooling chooses the build, the start command and the rules."
  - id: c
    text: "The package becomes a `frontend` by default."
    explanation: "There is no such guaranteed default."
  - id: d
    text: "The package is built twice."
    explanation: "A missing role does not cause a double build."
  correct_option: b
  explanation: "The role is how the tooling chooses the build, the start command and the rules."
- id: ats069-030-q22
  type: single_choice
  difficulty: beginner
  learning_objective: "Separate transpiling from type checking"
  source_readings:
  - sections/section-030/module-03/course-02-transpiling-without-type-checking.md
  prompt: "The package build finishes with exit code 0, and the root `tsc` script reports `Type 'unknown' is not assignable to type 'number'` in the same package. How do you read this?"
  options:
  - id: a
    text: "Both results are valid: the build converted the files and the type check found a type error that needs a source fix."
    explanation: "Correct. The build transpiles without checking types, so only the type check reports the error."
  - id: b
    text: "The type check is wrong, because the build passed."
    explanation: "The build does not check types, so its result says nothing about them."
  - id: c
    text: "The build must be run again with `--clean`."
    explanation: "Cleaning output does not change a type error."
  - id: d
    text: "The error appears only on the first run."
    explanation: "The error is in the source and appears on every run."
  correct_option: a
  explanation: "The build transpiles without checking types, so only the type check reports the error."
- id: ats069-030-q23
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain why the build is fast"
  source_readings:
  - sections/section-030/module-03/course-02-transpiling-without-type-checking.md
  prompt: "Why can a transpiler that works on one file at a time be faster than a type check?"
  options:
  - id: a
    text: "It skips reading the file."
    explanation: "A transpiler reads the file it converts."
  - id: b
    text: "It uses the network to check types."
    explanation: "Type checking is local and does not use the network."
  - id: c
    text: "It writes fewer lines than the source."
    explanation: "The speed comes from doing less analysis, not from output size."
  - id: d
    text: "It does not need the types of the imported files, only the syntax of the file it converts."
    explanation: "Correct. A type check needs the whole program, because types depend on declarations in many files."
