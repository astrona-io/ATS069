  prompt: "After a clean checkout, the pipeline fails during the build with a message that an import cannot be resolved. Which step owns the failure, and what do you run?"
  options:
  - id: a
    text: "The type check step; run `tsc` with `--skipLibCheck false`."
    explanation: "A resolution failure in the build is not found by a different compiler flag."
