  options:
  - id: a
    text: Add `--fix`.
    explanation: The option `--fix` belongs to the linter.
  - id: b
    text: Run the test command twice.
    explanation: Watch mode still never exits.
  - id: c
    text: Run once, with the `CI` environment variable set or with `--watch=false`.
