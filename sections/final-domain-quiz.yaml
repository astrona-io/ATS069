questions:
- id: ats069-final-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the responsibilities of the app and backend workspaces
  source_readings:
  - sections/section-010/module-01/course-01-workspaces-and-the-parts-of-a-project.md
  prompt: The `portal` page renders, but the deployment-status card shows a failed
    request. Which check comes first?
  options:
  - id: a
    text: Read the requested route, the response status and the backend log.
    explanation: Correct. The page renders, so the app workspace works. The failed
      request crosses to the backend, so the route, status and server log show the
      first failing boundary.
  - id: b
    text: Rebuild the logo asset in the `app` package.
    explanation: This option does not address the situation.
  - id: c
    text: Reinstall the browser.
    explanation: This option does not address the situation.
  - id: d
    text: Change the TypeScript target.
    explanation: This option does not address the situation.
  correct_option: a
  explanation: The page renders, so the app workspace works. The failed request crosses
    to the backend, so the route, status and server log show the first failing boundary.
- id: ats069-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Locate startup failures by dependency, configuration and process
    boundaries
  source_readings:
  - sections/section-010/module-01/course-02-development-servers-and-configuration.md
  prompt: The backend compiles but stops at startup with a message about a missing
    required configuration key. Which boundary failed?
  options:
  - id: a
    text: Package resolution.
    explanation: This option does not address the situation.
  - id: b
    text: Configuration loading.
    explanation: Correct. Compilation passed, so the configuration the process reads
      at startup is missing a key.
  - id: c
    text: Browser rendering.
    explanation: This option does not address the situation.
  - id: d
    text: Image layering.
    explanation: This option does not address the situation.
  correct_option: b
  explanation: Compilation passed, so the configuration the process reads at startup
    is missing a key.
- id: ats069-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a development server from a production artifact
  source_readings:
  - sections/section-010/module-01/course-03-production-builds-and-artifacts.md
  prompt: A project runs with the development script. Why does that not show the production
    build works?
  options:
  - id: a
    text: Development scripts cannot start a backend.
    explanation: This option does not address the situation.
  - id: b
    text: Production builds skip configuration.
    explanation: This option does not address the situation.
  - id: c
    text: The artifact has its own build output and runtime files that the development
      server never uses.
    explanation: Correct. Only running the built output shows that it holds every
      file it needs.
  - id: d
    text: The development server compiles for a different language.
    explanation: This option does not address the situation.
  correct_option: c
  explanation: Only running the built output shows that it holds every file it needs.
- id: ats069-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Trace a source change through the relevant workspace and checks
  source_readings:
  - sections/section-020/module-01/course-01-tracing-a-change-through-the-workspace.md
  prompt: A change edits a type exported by a shared package used by `app` and `backend`.
    Which checks are relevant?
  options:
  - id: a
    text: Only the shared package tests.
    explanation: This option does not address the situation.
  - id: b
    text: Only the `app` package.
    explanation: This option does not address the situation.
  - id: c
    text: No check, because types are removed at run time.
    explanation: This option does not address the situation.
  - id: d
    text: Checks for the shared package and for every package that imports it.
    explanation: Correct. Packages that import the type can break at compile time,
      so their checks matter.
  correct_option: d
  explanation: Packages that import the type can break at compile time, so their checks
    matter.
- id: ats069-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why fast feedback needs both type and behavior checks
  source_readings:
  - sections/section-020/module-01/course-02-fast-feedback-type-checks-tests-and-lint.md
  prompt: A function passes `tsc` but returns the wrong value for an input. Which
    check finds it?
  options:
  - id: a
    text: A test that runs the function.
    explanation: Correct. Types describe shape. Behavior needs a test that runs the
      code.
  - id: b
    text: A lint rule only.
    explanation: This option does not address the situation.
  - id: c
    text: The type checker with a stricter flag.
    explanation: This option does not address the situation.
  - id: d
    text: The package lockfile.
    explanation: This option does not address the situation.
  correct_option: a
  explanation: Types describe shape. Behavior needs a test that runs the code.
- id: ats069-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish local overrides from committed project configuration
  source_readings:
  - sections/section-020/module-01/course-03-local-overrides-configuration-and-reviewable-changes.md
  prompt: A developer needs a personal database password. Where does it belong?
  options:
  - id: a
    text: In `app-config.yaml`, committed.
    explanation: This option does not address the situation.
  - id: b
    text: In an uncommitted local override file such as `app-config.local.yaml`.
    explanation: Correct. Local override files stay out of the repository, so a personal
      secret is not shared with reviewers.
  - id: c
    text: In `package.json`.
    explanation: This option does not address the situation.
  - id: d
    text: In `tsconfig.json`.
    explanation: This option does not address the situation.
  correct_option: b
  explanation: Local override files stay out of the repository, so a personal secret
    is not shared with reviewers.
- id: ats069-final-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish TypeScript checking from JavaScript execution
  source_readings:
  - sections/section-030/module-01/course-01-checking-emitting-and-tsconfig-scope.md
  prompt: What does `tsc --noEmit` do?
  options:
  - id: a
    text: It runs the program.
    explanation: This option does not address the situation.
  - id: b
    text: It installs dependencies.
    explanation: This option does not address the situation.
  - id: c
    text: It checks types and writes no JavaScript output.
    explanation: Correct. The flag stops the compiler from writing files, so only
      checking happens.
  - id: d
    text: It bundles the backend.
    explanation: This option does not address the situation.
  correct_option: c
  explanation: The flag stops the compiler from writing files, so only checking happens.
- id: ats069-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Diagnose type errors separately from runtime integration failures
  source_readings:
  - sections/section-030/module-01/course-02-types-optional-values-and-runtime-boundaries.md
  prompt: A value typed as `string` is `undefined` at run time because an API response
    lacked a field. Why did `tsc` not report it?
  options:
  - id: a
    text: "`tsc` only reads comments."
    explanation: This option does not address the situation.
  - id: b
    text: The field was in `node_modules`.
    explanation: This option does not address the situation.
  - id: c
    text: "`tsc` skips functions."
    explanation: This option does not address the situation.
  - id: d
    text: Types are erased and do not validate data that arrives at run time.
    explanation: Correct. A type assertion trusts the data. Run-time validation is
      the check.
  correct_option: d
  explanation: A type assertion trusts the data. Run-time validation is the check.
- id: ats069-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain workspace build dependencies and generated artifacts
  source_readings:
  - sections/section-030/module-01/course-03-workspace-builds-references-and-declarations.md
  prompt: Why do project references order the build of packages?
  options:
  - id: a
    text: A package must build its declarations before a package that imports its
      types.
    explanation: Correct. The importing package reads the declaration output of the
      package it depends on.
  - id: b
    text: They install packages in parallel.
    explanation: This option does not address the situation.
  - id: c
    text: They remove the lockfile.
    explanation: This option does not address the situation.
  - id: d
    text: They only rename output folders.
    explanation: This option does not address the situation.
  correct_option: a
  explanation: The importing package reads the declaration output of the package it
    depends on.
- id: ats069-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain manifest and lockfile responsibilities in a workspace
    project
  source_readings:
  - sections/section-040/module-01/course-01-manifests-version-ranges-and-the-lockfile.md
  prompt: What does the lockfile record that `package.json` does not?
  options:
  - id: a
    text: The project description.
    explanation: This option does not address the situation.
  - id: b
    text: The exact resolved version of each dependency.
    explanation: Correct. `package.json` holds ranges. The lockfile pins the exact
      versions.
  - id: c
    text: The scripts.
    explanation: This option does not address the situation.
  - id: d
    text: The workspace names.
    explanation: This option does not address the situation.
  correct_option: b
  explanation: "`package.json` holds ranges. The lockfile pins the exact versions."
- id: ats069-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish compatible dependency resolution from arbitrary
    upgrades
  source_readings:
  - sections/section-040/module-01/course-02-workspaces-and-the-dependency-boundary.md
  prompt: A range `^1.2.0` is in a manifest. Which version can an install without
    a lockfile choose?
  options:
  - id: a
    text: Only 1.2.0.
    explanation: This option does not address the situation.
  - id: b
    text: Version 2.0.0.
    explanation: This option does not address the situation.
  - id: c
    text: Any 1.x version at or above 1.2.0.
    explanation: Correct. A caret range allows compatible minor and patch releases
      and blocks the next major.
  - id: d
    text: Any version at all.
    explanation: This option does not address the situation.
  correct_option: c
  explanation: A caret range allows compatible minor and patch releases and blocks
    the next major.
- id: ats069-final-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify environment and dependency causes of installation failure
  source_readings:
  - sections/section-040/module-01/course-03-reproducible-installs-resolutions-and-failures.md
  prompt: A CI job runs `yarn install --immutable` and fails because the lockfile
    would change. What is the most likely cause?
  options:
  - id: a
    text: The Node.js version is too new.
    explanation: This option does not address the situation.
  - id: b
    text: Docker is not installed.
    explanation: This option does not address the situation.
  - id: c
    text: The backend port is in use.
    explanation: This option does not address the situation.
  - id: d
    text: "`package.json` changed without a matching lockfile update."
    explanation: Correct. The flag refuses to modify the lockfile, so a stale lockfile
      fails the install.
  correct_option: d
  explanation: The flag refuses to modify the lockfile, so a stale lockfile fails
    the install.
- id: ats069-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe the files and dependencies a Backstage container needs
  source_readings:
  - sections/section-050/module-01/course-01-image-contents-and-build-context.md
  prompt: A host-build image starts with a missing-file error for the bundle. A `.dockerignore`
    file is the likely cause because it...
  options:
  - id: a
    text: Excludes the built files from the build context.
    explanation: Correct. Files excluded from the build context cannot be copied into
      the image.
  - id: b
    text: Changes the base image.
    explanation: This option does not address the situation.
  - id: c
    text: Sets the container user.
    explanation: This option does not address the situation.
  - id: d
    text: Removes port 7007.
    explanation: This option does not address the situation.
  correct_option: a
  explanation: Files excluded from the build context cannot be copied into the image.
- id: ats069-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain host-build and multi-stage packaging tradeoffs
  source_readings:
  - sections/section-050/module-01/course-02-host-build-and-multi-stage-builds.md
  prompt: What does a multi-stage build change compared with a host build?
  options:
  - id: a
    text: It skips the build.
    explanation: This option does not address the situation.
  - id: b
    text: The build runs inside the image build, and only the needed output reaches
      the final stage.
    explanation: Correct. A builder stage compiles the project. The final stage copies
      only the output it needs.
  - id: c
    text: It needs no Dockerfile.
    explanation: This option does not address the situation.
  - id: d
    text: It uses the host's `node_modules`.
    explanation: This option does not address the situation.
  correct_option: b
  explanation: A builder stage compiles the project. The final stage copies only the
    output it needs.
- id: ats069-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a built image from a correctly configured deployment
  source_readings:
  - sections/section-050/module-01/course-03-runtime-configuration-identity-and-evidence.md
  prompt: The image builds and starts, but the backend rejects requests that need
    a secret. What is the likely gap?
  options:
  - id: a
    text: The image has too many layers.
    explanation: This option does not address the situation.
  - id: b
    text: The Dockerfile has a comment.
    explanation: This option does not address the situation.
  - id: c
    text: The secret was not given to the container at run time.
    explanation: Correct. An image holds the build output. Secrets and environment-specific
      configuration arrive when the container runs.
  - id: d
    text: The lockfile is missing.
    explanation: This option does not address the situation.
  correct_option: c
  explanation: An image holds the build output. Secrets and environment-specific configuration
    arrive when the container runs.
- id: ats069-final-q16
  type: single_choice
  difficulty: beginner
  learning_objective: Describe what the project generator creates
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: A team runs npx @backstage/create-app@latest and later wants to know who
    maintains the generated root scripts. Who owns them?
  options:
  - id: a
    text: The Backstage project, which updates them with each release.
    explanation: The generator copies a template once. It does not update files later.
  - id: b
    text: The project owner, because the generator copies a template and does not
      manage it afterwards.
    explanation: Correct. After generation every file belongs to the project owner.
  - id: c
    text: Yarn, which regenerates them at install.
    explanation: Yarn installs dependencies. It does not rewrite project scripts.
  - id: d
    text: The npm registry, which serves the latest copy.
    explanation: The registry serves packages, not the files of an existing project.
  correct_option: b
  explanation: The generator copies a template once, so the project owner owns every
    file afterwards.
- id: ats069-final-q17
  type: single_choice
  difficulty: beginner
  learning_objective: Describe what the project generator creates
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: Which folder holds the browser application in a generated project?
  options:
  - id: a
    text: plugins/app
    explanation: The plugins folder starts empty and holds plugins written by the
      team.
  - id: b
    text: packages/backend
    explanation: This folder holds the backend process.
  - id: c
    text: packages/app
    explanation: Correct. The frontend application is in packages/app.
  - id: d
    text: examples
    explanation: This folder holds example catalog entities.
  correct_option: c
  explanation: The frontend application is in packages/app and the backend is in packages/backend.
- id: ats069-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe what the project generator creates
  source_readings:
  - sections/section-010/module-02/course-01-what-the-project-generator-creates.md
  prompt: A developer wants a configuration file for settings that belong to one machine
    only, such as a local token. Which approach matches the generated project?
  options:
  - id: a
    text: Edit app-config.production.yaml and commit it.
    explanation: The production file is shared and committed.
  - id: b
    text: Create app-config.local.yaml, which the generated .gitignore excludes, and
      pass it with --config.
    explanation: Correct. The local file name is excluded from version control by
      convention.
  - id: c
    text: Edit files under node_modules.
    explanation: Yarn replaces node_modules at the next install.
  - id: d
    text: Put the token in backstage.json.
    explanation: backstage.json records the Backstage release.
  correct_option: b
  explanation: A local configuration file that the .gitignore excludes keeps machine
    settings out of the repository.
- id: ats069-final-q19
  type: single_choice
  difficulty: beginner
  learning_objective: Explain the roles of ports 3000 and 7007
  source_readings:
  - sections/section-010/module-03/course-01-ports-base-urls-and-cors.md
  prompt: Which two origins are different for a browser?
  options:
  - id: a
    text: http://localhost:3000 and http://localhost:3000/catalog
    explanation: Only the path differs, so the origin is the same.
  - id: b
    text: http://localhost:3000 and http://localhost:7007
    explanation: Correct. The port is part of the origin.
  - id: c
    text: http://localhost:7007/api and http://localhost:7007/healthcheck
    explanation: Only the path differs.
  - id: d
    text: http://localhost:3000 and http://localhost:3000?x=1
    explanation: Only the query differs.
  correct_option: b
  explanation: An origin is scheme, host and port, so a different port is a different
    origin.
- id: ats069-final-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the roles of ports 3000 and 7007
  source_readings:
  - sections/section-010/module-03/course-01-ports-base-urls-and-cors.md
  prompt: The app loads, but every card shows a network error. The browser developer
    tools report a CORS error for requests to port 7007. Which value is the first
    to check?
  options:
  - id: a
    text: backend.database.client
    explanation: The database does not decide CORS answers.
  - id: b
    text: backend.cors.origin, which must equal app.baseUrl
    explanation: Correct. The backend must allow the origin of the app.
  - id: c
    text: catalog.locations
    explanation: Locations decide catalog data, not CORS.
  - id: d
    text: auth.environment
    explanation: This decides the sign-in mode.
  correct_option: b
  explanation: CORS errors are decided by backend.cors, whose origin must match the
    app origin exactly.
- id: ats069-final-q21
  type: single_choice
  difficulty: beginner
  learning_objective: Compare the SQLite database of a local start with a PostgreSQL
    database
  source_readings:
  - sections/section-010/module-03/course-02-databases-sqlite-and-postgresql.md
  prompt: What happens to data stored in SQLite with the connection ':memory:' when
    the backend stops?
  options:
  - id: a
    text: It is saved to a file in packages/backend.
    explanation: The memory connection does not write a file.
  - id: b
    text: It is lost, because it lived in the memory of the process.
    explanation: Correct. Catalog data from locations loads again at the next start.
  - id: c
    text: It moves to PostgreSQL.
    explanation: No migration happens.
  - id: d
    text: It stays in the browser.
    explanation: The database belongs to the backend.
  correct_option: b
  explanation: In-memory SQLite data is lost when the process stops.
- id: ats069-final-q22
  type: single_choice
  difficulty: beginner
  learning_objective: Create a plugin package with yarn new
  source_readings:
  - sections/section-020/module-02/course-01-creating-a-plugin-with-yarn-new.md
  prompt: A new folder `plugins/orders-backend` exists, but `yarn workspaces list`
    does not show it. What is the most likely cause?
  options:
  - id: a
    text: The plugin id is longer than eight characters.
    explanation: The id has no length limit that affects the workspace list.
  - id: b
    text: No pattern in the `workspaces` field of the root `package.json` matches
      the folder.
    explanation: Correct. Yarn treats only folders that match a workspaces pattern
      as workspaces.
  - id: c
    text: The folder is missing a `dev/` entry point.
    explanation: The entry point is needed to run the plugin alone, not to be a workspace.
  - id: d
    text: Yarn lists only frontend plugins.
    explanation: Yarn lists every package that a workspace pattern matches.
  correct_option: b
  explanation: Correct. Yarn treats only folders that match a workspaces pattern as
    workspaces.
- id: ats069-final-q23
  type: single_choice
  difficulty: beginner
  learning_objective: Create a plugin package with yarn new
  source_readings:
  - sections/section-020/module-02/course-01-creating-a-plugin-with-yarn-new.md
  prompt: Where does `yarn new` put a new backend plugin with the id `orders` in a
    generated Backstage project?
  options:
  - id: a
    text: "`plugins/orders-backend`"
    explanation: Correct. Backend plugins get the suffix `-backend` in their folder
      name.
  - id: b
    text: "`packages/orders`"
    explanation: The `packages/` folder holds the app and the backend, not plugins.
  - id: c
    text: "`plugins/orders`"
    explanation: This is the folder name for a frontend plugin.
  - id: d
    text: "`node_modules/@internal/orders`"
    explanation: "`node_modules` holds installed links, not source."
  correct_option: a
  explanation: Correct. Backend plugins get the suffix `-backend` in their folder
    name.
- id: ats069-final-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: Create a plugin package with yarn new
  source_readings:
  - sections/section-020/module-02/course-01-creating-a-plugin-with-yarn-new.md
  prompt: A backend plugin has the folder `plugins/hello-backend`, the package name
    `@internal/plugin-hello-backend` and the plugin id `hello`. Which value decides
    the route prefix?
  options:
  - id: a
    text: The folder name, so the routes live under `/api/hello-backend`.
    explanation: The folder name is not read by the backend.
  - id: b
    text: The package name, so the routes live under `/api/plugin-hello-backend`.
    explanation: The package name identifies the package for imports only.
  - id: c
    text: The port of the backend process.
    explanation: All plugins share one port.
  - id: d
    text: The plugin id, so the routes live under `/api/hello`.
    explanation: Correct. The backend mounts a plugin under `/api/<plugin id>`.
  correct_option: d
  explanation: Correct. The backend mounts a plugin under `/api/<plugin id>`.
- id: ats069-final-q25
  type: single_choice
  difficulty: beginner
  learning_objective: Run the tests with backstage-cli
  source_readings:
  - sections/section-020/module-03/course-01-running-tests-with-backstage-cli.md
  prompt: Which command runs the tests of every package in a Backstage repository?
  options:
  - id: a
    text: "`backstage-cli package test`"
    explanation: This runs only the package in the current folder.
  - id: b
    text: "`backstage-cli repo lint`"
