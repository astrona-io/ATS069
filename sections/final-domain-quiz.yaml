  correct_option: c
  explanation: Correct. A pipeline needs a run that exits with a code.
- id: ats069-final-q27
  type: single_choice
  difficulty: intermediate
  learning_objective: Run the tests with backstage-cli
  source_readings:
  - sections/section-020/module-03/course-01-running-tests-with-backstage-cli.md
  prompt: A test fails with the expected value `missing` and the actual value `error`.
    The behavior was not meant to change. What is the right action?
  options:
  - id: a
    text: Change the expected value to `error`.
    explanation: This removes the guard for the old behavior.
  - id: b
    text: Fix the code so that it returns `missing`.
    explanation: Correct. Change the code, not the expectation, unless the behavior
      was meant to change.
  - id: c
    text: Delete the test.
    explanation: The test describes wanted behavior.
  - id: d
    text: Run the test again until it passes.
    explanation: A deterministic failure does not go away.
  correct_option: b
  explanation: Correct. Change the code, not the expectation, unless the behavior
    was meant to change.
- id: ats069-final-q28
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what a shared base tsconfig sets
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: 'A root `tsconfig.json` has `"extends": "./tsconfig.base.json"` and does
    not mention `strict`. The base sets `strict` to `true`. What is the value of `strict`
    for the root project?'
  options:
  - id: a
    text: "`false`, because an option that is not set defaults to off."
    explanation: A default applies only when no file in the chain sets the option.
      The base sets it.
  - id: b
    text: "`true`, because options the extending file does not set keep the value
      from the base."
    explanation: Correct. Options that the extending file does not mention are inherited
      from the base.
  - id: c
    text: The compiler stops with an error, because every option must appear in the
      root file.
    explanation: The root file does not need to repeat inherited options.
  - id: d
    text: It depends on the operating system.
    explanation: Inheritance through `extends` does not depend on the operating system.
  correct_option: b
  explanation: Options that the extending file does not mention are inherited from
    the base.
- id: ats069-final-q29
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the merged configuration
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: Which command prints the compiler options that really apply to a project
    after `extends` is resolved?
  options:
  - id: a
    text: "`tsc --showConfig`"
    explanation: Correct. It prints the configuration after the whole `extends` chain
      is merged.
  - id: b
    text: "`tsc --listFilesOnly`"
    explanation: It lists the files of the project and does not print the options.
  - id: c
    text: "`tsc --noEmit`"
    explanation: It stops the compiler from writing output and prints no configuration.
  - id: d
    text: "`npm ls typescript`"
    explanation: It lists the installed package version and does not show the options.
  correct_option: a
  explanation: It prints the configuration after the whole `extends` chain is merged.
- id: ats069-final-q30
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain precedence between a base and an extending file
  source_readings:
  - sections/section-030/module-02/course-01-what-the-shared-base-configuration-sets.md
  prompt: 'The base file has `"include": ["packages/*/src"]`. A file that extends
    it sets `"include": ["plugins/*/src"]`. Which files does the extending project
    include?'
  options:
  - id: a
    text: The files under both patterns, because the lists are merged.
    explanation: "`include`, `exclude` and `files` are replaced, not merged."
  - id: b
    text: Only the files under `packages/*/src`, because the base always wins.
    explanation: The extending file wins for the fields it sets.
  - id: c
    text: No files, because two `include` fields conflict.
    explanation: Two files setting `include` do not conflict; the nearest one is used.
  - id: d
    text: Only the files under `plugins/*/src`, because the list is replaced and not
      merged.
    explanation: Correct. The `include` field of the extending file replaces the one
      from the base as a whole.
  correct_option: d
  explanation: The `include` field of the extending file replaces the one from the
    base as a whole.
- id: ats069-final-q31
  type: single_choice
  difficulty: beginner
  learning_objective: Explain package roles
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: Which field of `package.json` tells `backstage-cli` what kind of package
    it is building?
  options:
  - id: a
    text: "`main`"
    explanation: "`main` names the entry file of the package."
  - id: b
    text: "`files`"
    explanation: "`files` lists what a published package contains."
  - id: c
    text: "`private`"
    explanation: "`private` blocks publishing and says nothing about the kind of package."
  - id: d
    text: "`backstage.role`"
    explanation: Correct. The role names the kind of package, for example `frontend`
      or `backend-plugin`.
  correct_option: d
  explanation: The role names the kind of package, for example `frontend` or `backend-plugin`.
- id: ats069-final-q32
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose the right role
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: A package holds shared types and helper functions that both the browser
    app and the backend import, and it uses no Node.js-only API. Which role fits?
  options:
  - id: a
    text: "`node-library`"
    explanation: It is meant for code that runs on Node.js only.
  - id: b
    text: "`web-library`"
    explanation: It is meant for code that runs in the browser only.
  - id: c
    text: "`common-library`"
    explanation: Correct. A library that can run in both places is a `common-library`.
  - id: d
    text: "`backend`"
    explanation: It is the backend application, not a library.
  correct_option: c
  explanation: A library that can run in both places is a `common-library`.
- id: ats069-final-q33
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the effect of a missing role
  source_readings:
  - sections/section-030/module-03/course-01-package-roles-in-package-json.md
  prompt: A package has no `backstage.role`. What is the consequence?
  options:
  - id: a
    text: Nothing, because the role is only documentation.
    explanation: The tooling reads the role.
  - id: b
    text: The tooling cannot tell which build and rules to use, so the package is
      not built correctly.
    explanation: Correct. The role is how the tooling chooses the build, the start
      command and the rules.
  - id: c
    text: The package becomes a `frontend` by default.
    explanation: There is no such guaranteed default.
  - id: d
    text: The package is built twice.
    explanation: A missing role does not cause a double build.
  correct_option: b
  explanation: The role is how the tooling chooses the build, the start command and
    the rules.
- id: ats069-final-q34
  type: single_choice
  difficulty: beginner
  learning_objective: Read .yarnrc.yml and say what its settings control
  source_readings:
  - sections/section-040/module-02/course-01-the-yarn-configuration-file-and-the-linker.md
  prompt: 'A Backstage repository sets `nodeLinker: node-modules` in `.yarnrc.yml`.
    What does this setting control?'
  options:
  - id: a
    text: 'How Yarn writes installed packages to disk: as a `node_modules` folder.'
    explanation: Correct. The linker decides the on-disk layout, and Backstage tooling
      expects `node_modules`.
  - id: b
    text: Which registry Yarn downloads packages from.
    explanation: The registry is set by `npmRegistryServer`.
  - id: c
    text: Which Node.js release runs the scripts.
    explanation: Yarn does not choose the Node.js release with this setting.
  - id: d
    text: Whether `yarn.lock` is written.
    explanation: The lockfile is written whatever the linker is.
  correct_option: a
  explanation: Correct. The linker decides the on-disk layout, and Backstage tooling
    expects `node_modules`.
- id: ats069-final-q35
  type: single_choice
  difficulty: intermediate
  learning_objective: Read .yarnrc.yml and say what its settings control
  source_readings:
  - sections/section-040/module-02/course-01-the-yarn-configuration-file-and-the-linker.md
  prompt: On a build server, `yarn config get enableGlobalCache` prints `true`, but
    the repository `.yarnrc.yml` says `false`. What is the most likely cause?
  options:
  - id: a
    text: Yarn ignores `.yarnrc.yml` files in repositories.
    explanation: Yarn reads the repository file and merges it with other sources.
  - id: b
    text: A user-level `.yarnrc.yml` or a `YARN_ENABLE_GLOBAL_CACHE` environment variable
      overrides the repository file.
    explanation: Correct. Yarn merges settings from several places, and environment
      variables win over files.
  - id: c
    text: The lockfile overrides the setting.
    explanation: The lockfile records resolved packages, not settings.
  - id: d
    text: "`enableGlobalCache` cannot be set in a file."
    explanation: It is a normal setting that a file can hold.
  correct_option: b
  explanation: Correct. Yarn merges settings from several places, and environment
    variables win over files.
- id: ats069-final-q36
  type: single_choice
  difficulty: beginner
  learning_objective: Read .yarnrc.yml and say what its settings control
  source_readings:
  - sections/section-040/module-02/course-01-the-yarn-configuration-file-and-the-linker.md
  prompt: Which items does a Backstage repository normally commit?
  options:
  - id: a
    text: The `node_modules` folder and `.yarn/install-state.gz`.
    explanation: These are outputs of an install, so they belong in `.gitignore`.
  - id: b
    text: Only `yarn.lock`.
    explanation: Without the manifests the lockfile has nothing to match.
  - id: c
    text: The manifests, `yarn.lock`, `.yarnrc.yml` and the release file under `.yarn/releases`.
    explanation: Correct. These are inputs that describe the project.
  - id: d
    text: Only the manifests.
    explanation: Without the lockfile, installs are not reproducible.
  correct_option: c
  explanation: Correct. These are inputs that describe the project.
- id: ats069-final-q37
  type: single_choice
  difficulty: beginner
  learning_objective: Describe what backstage-cli versions:bump changes
  source_readings:
  - sections/section-040/module-03/course-01-upgrading-backstage-with-versions-bump.md
  prompt: Which files does `yarn backstage-cli versions:bump` change?
  options:
  - id: a
    text: Only `yarn.lock`.
    explanation: Manifests and `backstage.json` change too.
  - id: b
    text: The source code of the plugins.
    explanation: It does not fix breaking code changes.
  - id: c
    text: The manifests with `@backstage` ranges, `backstage.json` and, through the
      install, `yarn.lock`.
    explanation: Correct. It also runs the install step.
  - id: d
    text: The `Dockerfile` of the project.
    explanation: Template files are not rewritten.
  correct_option: c
  explanation: Correct. It also runs the install step.
- id: ats069-final-q38
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe what backstage-cli versions:bump changes
  source_readings:
  - sections/section-040/module-03/course-01-upgrading-backstage-with-versions-bump.md
  prompt: After a bump, `yarn install --immutable` passes. Which claim does this support?
  options:
  - id: a
    text: The upgraded code compiles.
    explanation: The install does not run the compiler.
  - id: b
    text: The tests pass.
    explanation: The install does not run tests.
  - id: c
    text: The release notes need no reading.
    explanation: Breaking changes still need to be read.
  - id: d
    text: The manifests and the lockfile agree.
    explanation: Correct. It does not prove that the code compiles or passes tests.
  correct_option: d
  explanation: Correct. It does not prove that the code compiles or passes tests.
- id: ats069-final-q39
  type: single_choice
  difficulty: beginner
  learning_objective: Find why a package is installed with yarn why
  source_readings:
  - sections/section-040/module-03/course-02-finding-duplicate-and-vulnerable-packages.md
  prompt: Which command shows which packages ask for `semver` and which version Yarn
    selected?
  options:
  - id: a
    text: "`yarn why semver`"
    explanation: Correct. The flag `-R` adds the chain to the workspace.
  - id: b
    text: "`yarn dedupe semver`"
    explanation: It rewrites the lockfile; it does not explain.
  - id: c
    text: "`yarn npm audit semver`"
    explanation: It reports advisories.
  - id: d
    text: "`yarn up semver`"
    explanation: It updates the package.
  correct_option: a
  explanation: Correct. The flag `-R` adds the chain to the workspace.
- id: ats069-final-q40
  type: single_choice
  difficulty: beginner
  learning_objective: Control the build context with a .dockerignore file
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: What is the build context of `docker image build . -f packages/backend/Dockerfile
    --tag backstage`?
  options:
  - id: a
    text: The set of files under `.` that the client sends to the daemon, after the
      ignore file removes some.
    explanation: Correct. The last path argument is the context root, and the daemon
      can read only files in it.
  - id: b
    text: Only the Dockerfile named with `-f`.
    explanation: The Dockerfile is one file in the context. The `COPY` instructions
      read other files from it too.
  - id: c
    text: All files on the host that the user can read.
    explanation: The daemon cannot read files outside the context path.
  - id: d
    text: The layers of the base image.
    explanation: Layers of the base image are part of the image, not of the context.
  correct_option: a
  explanation: Correct. The last path argument is the context root, and the daemon
    can read only files in it.
- id: ats069-final-q41
  type: single_choice
  difficulty: beginner
  learning_objective: Control the build context with a .dockerignore file
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: A `.dockerignore` file in the context root contains `*.local.yaml`. Which
    file does it exclude?
  options:
  - id: a
    text: Every `.local.yaml` file in every folder.
    explanation: That needs `**/*.local.yaml`.
  - id: b
    text: "`app-config.local.yaml` in the context root only."
    explanation: Correct. A single star does not cross a folder boundary, so `packages/backend/app-config.local.yaml`
      stays in the context.
  - id: c
    text: Only files named exactly `*.local.yaml`.
    explanation: The star is a wildcard, not part of the file name.
  - id: d
    text: No file, because the ignore file only affects `COPY` with wildcards.
    explanation: The ignore file removes files from the context before the transfer.
  correct_option: b
  explanation: Correct. A single star does not cross a folder boundary, so `packages/backend/app-config.local.yaml`
    stays in the context.
- id: ats069-final-q42
  type: single_choice
  difficulty: intermediate
  learning_objective: Control the build context with a .dockerignore file
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: A `COPY` of `packages/backend/dist/bundle.tar.gz` fails with a message that
    the file was not found, although `ls` shows it. What is the first thing to read?
  options:
  - id: a
    text: The Node.js version in the base image.
    explanation: The Node.js version does not affect whether a file is found in the
      context.
  - id: b
    text: The `CMD` instruction.
    explanation: "`CMD` runs at container start, after the build."
  - id: c
    text: The `.dockerignore` file, for a pattern that removes `packages/*/dist`.
    explanation: Correct. A file on disk is not in the context if a pattern excludes
      it.
  - id: d
    text: The Docker daemon log for network errors.
    explanation: The daemon reads the context from the client, so this is not a network
      problem.
  correct_option: c
  explanation: Correct. A file on disk is not in the context if a pattern excludes
    it.
- id: ats069-final-q43
  type: single_choice
  difficulty: beginner
  learning_objective: Start, inspect and stop a container, and publish its port
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: What does `-p 8080:7007` do?
  options:
  - id: a
    text: It publishes container port 7007 on host port 8080.
    explanation: Correct. The host port is on the left and the container port is on
      the right.
  - id: b
    text: It publishes host port 7007 on container port 8080.
    explanation: The sides are the other way around.
  - id: c
    text: It makes the backend listen on port 8080.
    explanation: The process chooses its own port. The option only maps it.
  - id: d
    text: It limits the container to 8080 connections.
    explanation: The option does not limit connections.
  correct_option: a
  explanation: Correct. The host port is on the left and the container port is on
    the right.
- id: ats069-final-q44
  type: single_choice
  difficulty: intermediate
  learning_objective: Start, inspect and stop a container, and publish its port
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: A container publishes `-p 7007:7007`, but `curl` to the host port is refused.
    The log shows that the backend listens on `127.0.0.1:7007`. What is the cause?
  options:
  - id: a
    text: Port 7007 is reserved by Docker.
    explanation: Docker does not reserve that port.
  - id: b
    text: The process binds the loopback address inside the container, so published
      traffic cannot reach it.
    explanation: Correct. The backend must bind `0.0.0.0`, which the production configuration
      sets.
  - id: c
    text: The image has no layers.
    explanation: Every image has layers. This is not the cause.
  - id: d
    text: The container needs `--privileged`.
    explanation: Privileges do not change the bind address.
  correct_option: b
  explanation: Correct. The backend must bind `0.0.0.0`, which the production configuration
    sets.
- id: ats069-final-q45
  type: single_choice
  difficulty: beginner
  learning_objective: Start, inspect and stop a container, and publish its port
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: Which command shows why a container exited a moment after it started?
  options:
  - id: a
    text: "`docker image ls`"
    explanation: That lists images, not container output.
  - id: b
    text: "`docker build --no-cache`"
    explanation: That builds an image.
  - id: c
    text: "`docker logs <name>` together with `docker container ls -a`."
    explanation: Correct. The log shows the last output, and the list shows the exit
      status of stopped containers.
  - id: d
    text: "`docker network ls`"
    explanation: That lists networks.
  correct_option: c
  explanation: Correct. The log shows the last output, and the list shows the exit
    status of stopped containers.
