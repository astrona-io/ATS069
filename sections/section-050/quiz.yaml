# Knowledge check for section 050. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats069-050
course_id: ATS069
exam_code: CBA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-050
  title: Use Docker to build a container image of a Backstage project
questions:
- id: ats069-050-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Describe the files and dependencies a Backstage container needs
  source_readings:
  - sections/section-050/module-01/course-01-image-contents-and-build-context.md
  prompt: Which set of files does a standard Backstage backend image need at run time?
  options:
  - id: a
    text: The whole repository, including the Git history and the test files.
    explanation: The image does not need the repository. Extra files only add size
      and exposure.
  - id: b
    text: The compiled backend output, the production dependencies, the configuration
      files and a Node.js runtime.
    explanation: Correct. These are the inputs the backend needs to start.
  - id: c
    text: Only the TypeScript source, because the container compiles it on start.
    explanation: The standard image runs compiled output and does not compile at start.
  - id: d
    text: Only `app-config.local.yaml`, because it holds every setting.
    explanation: The local file is developer-only and must not be in the image.
  correct_option: b
  explanation: Correct. These are the inputs the backend needs to start.
- id: ats069-050-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Describe the files and dependencies a Backstage container needs
  source_readings:
  - sections/section-050/module-01/course-01-image-contents-and-build-context.md
  prompt: In a host-build arrangement, `docker image build . -f packages/backend/Dockerfile
    --tag backstage` fails at the instruction that copies `packages/backend/dist/bundle.tar.gz`,
    with a message that the file is not found. The file exists on disk. What is the
    most likely cause?
  options:
  - id: a
    text: The Dockerfile is in a subdirectory, and Docker only accepts a Dockerfile
      in the context root.
    explanation: The `-f` flag selects a Dockerfile in any directory.
  - id: b
    text: The tag `backstage` is reserved.
    explanation: Any valid name can be a tag. A tag does not cause a missing file.
  - id: c
    text: "`.dockerignore` excludes `packages/*/dist`, so the file is not in the build
      context."
    explanation: Correct. The daemon can read only files in the context, and the ignore
      file removed it.
  - id: d
    text: The Node.js base image has no `tar` command.
    explanation: A missing `tar` would cause a different error, at a later instruction.
  correct_option: c
  explanation: Correct. The daemon can read only files in the context, and the ignore
    file removed it.
- id: ats069-050-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain host-build and multi-stage packaging tradeoffs
  source_readings:
  - sections/section-050/module-01/course-02-host-build-and-multi-stage-builds.md
  prompt: A continuous integration job runs `yarn build:backend` on commit A. A later
    job packages the `packages/backend/dist` directory of a cached workspace from
    commit B with a host-build Dockerfile. The build succeeds. What is the risk?
  options:
  - id: a
    text: The image holds a backend from the wrong revision, and no step reports it.
    explanation: Correct. A host build packages whatever archives are present.
  - id: b
    text: Docker refuses to build because the revisions differ.
    explanation: Docker does not know about revisions. It copies files.
  - id: c
    text: The image runs as root because the revisions differ.
    explanation: The user comes from the `USER` instruction, not from the revision.
  - id: d
    text: The image has no `node_modules` directory.
    explanation: The dependency installation is a separate instruction.
  correct_option: a
  explanation: Correct. A host build packages whatever archives are present.
- id: ats069-050-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain host-build and multi-stage packaging tradeoffs
  source_readings:
  - sections/section-050/module-01/course-02-host-build-and-multi-stage-builds.md
  prompt: A multi-stage Dockerfile ends with `COPY --from=build /app /app`. What does
    this do to the intended separation of build and runtime?
  options:
  - id: a
    text: It keeps the separation, because the build stage is discarded.
    explanation: Only the copied files survive. This instruction copies everything.
  - id: b
    text: It copies the whole build directory, so source, scripts and local files
      can end up in the final image.
    explanation: Correct. The final stage must copy named files only.
  - id: c
    text: It makes the final image smaller than a host-build image.
    explanation: It can make the image larger, because it copies the build tree.
  - id: d
    text: It fails, because `COPY --from` needs a tag name and not a stage name.
    explanation: "`COPY --from` accepts a stage name."
  correct_option: b
  explanation: Correct. The final stage must copy named files only.
- id: ats069-050-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain host-build and multi-stage packaging tradeoffs
  source_readings:
  - sections/section-050/module-01/course-02-host-build-and-multi-stage-builds.md
  prompt: A team copies the `.dockerignore` of a host-build project to a project that
    uses a multi-stage Dockerfile. The file contains `packages/*/src`. What happens?
  options:
  - id: a
    text: Nothing, because ignore files apply only to the final stage.
    explanation: The ignore file edits the whole build context.
  - id: b
    text: The final image is smaller and correct.
    explanation: The build stage cannot compile without the source.
  - id: c
    text: Docker ignores the pattern, because it matches a directory.
    explanation: Directory patterns are valid.
  - id: d
    text: The build stage cannot read the source it compiles, and the build fails.
    explanation: Correct. The source must be in the context when Docker builds the
      backend.
  correct_option: d
  explanation: Correct. The source must be in the context when Docker builds the backend.
- id: ats069-050-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain host-build and multi-stage packaging tradeoffs
  source_readings:
  - sections/section-050/module-01/course-02-host-build-and-multi-stage-builds.md
  prompt: Which statement about the Dockerfile of a host build is correct?
  options:
  - id: a
    text: It is short, because the archives are built before Docker runs.
    explanation: Correct. The Dockerfile unpacks archives and does no compiling.
  - id: b
    text: It must contain a `FROM` line for every package of the workspace.
    explanation: One base image is enough. Multiple `FROM` lines are for multi-stage
      builds.
  - id: c
    text: It type-checks the project with `yarn tsc`.
    explanation: A host build runs `yarn tsc` before Docker, not in the Dockerfile.
  - id: d
    text: It cannot use a Node.js base image.
    explanation: The standard Dockerfile uses a Node.js base image.
  correct_option: a
  explanation: Correct. The Dockerfile unpacks archives and does no compiling.
- id: ats069-050-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a built image from a correctly configured deployment
  source_readings:
  - sections/section-050/module-01/course-03-runtime-configuration-identity-and-evidence.md
  prompt: A container starts and the log shows no error. A request to the published
    port `-p 7007:7007` is refused. The base `app-config.yaml` sets `listen.host`
    to `127.0.0.1`, and the production file sets `0.0.0.0`. The start command is `node
    packages/backend --config app-config.yaml`. What is the cause?
  options:
  - id: a
    text: The production file is not loaded, so the server listens only on the loopback
      address inside the container.
    explanation: Correct. Traffic from the published port arrives on the container
      interface, where nothing listens.
  - id: b
    text: The port 7007 is reserved by Docker.
    explanation: Docker does not reserve port 7007.
  - id: c
    text: Later `--config` files are ignored when the first file sets a host.
    explanation: Later files override earlier ones.
  - id: d
    text: The image runs as the `node` user, which cannot open port 7007.
    explanation: Port 7007 is above 1024, and any user can listen on it.
  correct_option: a
  explanation: Correct. Traffic from the published port arrives on the container interface,
    where nothing listens.
- id: ats069-050-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a built image from a correctly configured deployment
  source_readings:
  - sections/section-050/module-01/course-03-runtime-configuration-identity-and-evidence.md
  prompt: A Dockerfile has `COPY app-config*.yaml ./` and the build context contains
    `app-config.local.yaml` with a token. A later line runs `RUN rm app-config.local.yaml`.
    Is the token safe?
  options:
  - id: a
    text: Yes, because the file no longer exists in the final filesystem.
    explanation: The earlier layer still stores the file.
  - id: b
    text: Yes, because `.yaml` files are encrypted in images.
    explanation: Images do not encrypt files.
  - id: c
    text: No, because the earlier layer still holds the file, and anyone who can pull
      the image can read it.
    explanation: Correct. A later layer only hides the file. Keep it out of the context
      instead.
  - id: d
    text: No, but only when the image is pushed to a public registry.
    explanation: A private registry and every machine that pulls the image also receive
      the layer.
  correct_option: c
  explanation: Correct. A later layer only hides the file. Keep it out of the context
    instead.
- id: ats069-050-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a built image from a correctly configured deployment
  source_readings:
  - sections/section-050/module-01/course-03-runtime-configuration-identity-and-evidence.md
  prompt: A Dockerfile contains `WORKDIR /app`, `USER node` and then `RUN tar xzf
    bundle.tar.gz` with the archive copied by `COPY bundle.tar.gz ./`. The build fails
    with a permission error on the unpack. Which change fixes it?
  options:
  - id: a
    text: Move `USER node` to the end of the file and run everything as root.
    explanation: This keeps the build working but the container runs as root.
  - id: b
    text: Remove `WORKDIR`, because the user cannot use it.
    explanation: "`WORKDIR` is needed. The problem is who owns the directory."
  - id: c
    text: Add `RUN chmod 777 /` before `USER node`.
    explanation: This opens the whole filesystem and is not a fix.
  - id: d
    text: Run `RUN chown node:node /app` before `USER node`, and use `COPY --chown=node:node`.
    explanation: Correct. Docker creates `WORKDIR` as root, so the `node` user needs
      ownership.
  correct_option: d
  explanation: Correct. Docker creates `WORKDIR` as root, so the `node` user needs
    ownership.
- id: ats069-050-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Distinguish a built image from a correctly configured deployment
  source_readings:
  - sections/section-050/module-01/course-03-runtime-configuration-identity-and-evidence.md
  prompt: The image build completes and `docker image inspect` shows the user `node`,
    port 7007 and the expected command. The team states that the deployment is ready.
    Which claim is still unproved?
  options:
  - id: a
    text: The database is reachable and the ingress sends traffic to port 7007.
    explanation: Correct. A build and its metadata prove packaging only. Connectivity
      and permissions need separate checks.
  - id: b
    text: The image has layers.
    explanation: Every image has layers, and this is proved by the build.
  - id: c
    text: The image has a user.
    explanation: The inspect output shows the user.
  - id: d
    text: The image has a start command.
    explanation: The inspect output shows the command.
  correct_option: a
  explanation: Correct. A build and its metadata prove packaging only. Connectivity
    and permissions need separate checks.
- id: ats069-050-q11
  type: single_choice
  difficulty: beginner
  learning_objective: "Control the build context with a .dockerignore file"
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: "What is the build context of `docker image build . -f packages/backend/Dockerfile --tag backstage`?"
  options:
  - id: a
    text: "The set of files under `.` that the client sends to the daemon, after the ignore file removes some."
    explanation: "Correct. The last path argument is the context root, and the daemon can read only files in it."
  - id: b
    text: "Only the Dockerfile named with `-f`."
    explanation: "The Dockerfile is one file in the context. The `COPY` instructions read other files from it too."
  - id: c
    text: "All files on the host that the user can read."
    explanation: "The daemon cannot read files outside the context path."
  - id: d
    text: "The layers of the base image."
    explanation: "Layers of the base image are part of the image, not of the context."
  correct_option: a
  explanation: "Correct. The last path argument is the context root, and the daemon can read only files in it."
- id: ats069-050-q12
  type: single_choice
  difficulty: beginner
  learning_objective: "Control the build context with a .dockerignore file"
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: "A `.dockerignore` file in the context root contains `*.local.yaml`. Which file does it exclude?"
  options:
  - id: a
    text: "Every `.local.yaml` file in every folder."
    explanation: "That needs `**/*.local.yaml`."
  - id: b
    text: "`app-config.local.yaml` in the context root only."
    explanation: "Correct. A single star does not cross a folder boundary, so `packages/backend/app-config.local.yaml` stays in the context."
  - id: c
    text: "Only files named exactly `*.local.yaml`."
    explanation: "The star is a wildcard, not part of the file name."
  - id: d
    text: "No file, because the ignore file only affects `COPY` with wildcards."
    explanation: "The ignore file removes files from the context before the transfer."
  correct_option: b
  explanation: "Correct. A single star does not cross a folder boundary, so `packages/backend/app-config.local.yaml` stays in the context."
- id: ats069-050-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: "Control the build context with a .dockerignore file"
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: "A `COPY` of `packages/backend/dist/bundle.tar.gz` fails with a message that the file was not found, although `ls` shows it. What is the first thing to read?"
  options:
  - id: a
    text: "The Node.js version in the base image."
    explanation: "The Node.js version does not affect whether a file is found in the context."
  - id: b
    text: "The `CMD` instruction."
    explanation: "`CMD` runs at container start, after the build."
  - id: c
    text: "The `.dockerignore` file, for a pattern that removes `packages/*/dist`."
    explanation: "Correct. A file on disk is not in the context if a pattern excludes it."
  - id: d
    text: "The Docker daemon log for network errors."
    explanation: "The daemon reads the context from the client, so this is not a network problem."
  correct_option: c
  explanation: "Correct. A file on disk is not in the context if a pattern excludes it."
- id: ats069-050-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: "Control the build context with a .dockerignore file"
  source_readings:
  - sections/section-050/module-02/course-01-the-build-context-and-the-ignore-file.md
  prompt: "A repository has a host-build Dockerfile and a multi-stage Dockerfile that need different ignore patterns. What does BuildKit offer?"
  options:
  - id: a
    text: "A `--ignore` option that takes a pattern list."
    explanation: "`docker image build` has no such option."
  - id: b
    text: "A `COPY --exclude` that is always required."
    explanation: "Exclusion in `COPY` does not change the context transfer."
  - id: c
    text: "Nothing. All Dockerfiles in a repository must share one ignore file."
    explanation: "BuildKit supports a per-Dockerfile ignore file."
  - id: d
    text: "A file named like the Dockerfile with the suffix `.dockerignore`, which replaces the root ignore file for that build."
    explanation: "Correct. For `-f packages/backend/Dockerfile` BuildKit looks for `packages/backend/Dockerfile.dockerignore`."
  correct_option: d
  explanation: "Correct. For `-f packages/backend/Dockerfile` BuildKit looks for `packages/backend/Dockerfile.dockerignore`."
- id: ats069-050-q15
  type: single_choice
  difficulty: beginner
  learning_objective: "Explain what skeleton.tar.gz and bundle.tar.gz contain"
  source_readings:
  - sections/section-050/module-02/course-02-the-skeleton-and-bundle-archives.md
  prompt: "What does `skeleton.tar.gz` contain?"
  options:
  - id: a
    text: "The `package.json` files of the backend and the workspace packages it depends on, without code."
    explanation: "Correct. Yarn can resolve and install dependencies from it."
  - id: b
    text: "The compiled backend code."
    explanation: "That is the content of `bundle.tar.gz`."
  - id: c
    text: "The `node_modules` folder."
    explanation: "Dependencies are installed in the image by a Dockerfile step."
  - id: d
    text: "The configuration files."
    explanation: "Configuration files are copied by name into the image."
  correct_option: a
  explanation: "Correct. Yarn can resolve and install dependencies from it."
- id: ats069-050-q16
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain what skeleton.tar.gz and bundle.tar.gz contain"
  source_readings:
  - sections/section-050/module-02/course-02-the-skeleton-and-bundle-archives.md
  prompt: "Why does the Backstage Dockerfile unpack the skeleton and install dependencies before it copies the bundle?"
  options:
  - id: a
    text: "Yarn cannot read the bundle."
    explanation: "Yarn reads manifests, which the bundle also contains. The reason is caching."
  - id: b
    text: "The skeleton changes only when dependencies change, so the slow install step stays cached when only code changes."
    explanation: "Correct. The layer cache reuses the install step as long as the files before it are unchanged."
  - id: c
    text: "Docker requires archives to be unpacked in alphabetical order."
    explanation: "Docker has no such rule."
  - id: d
    text: "The skeleton holds the secrets that the install needs."
    explanation: "The skeleton holds package manifests, not secrets."
  correct_option: b
  explanation: "Correct. The layer cache reuses the install step as long as the files before it are unchanged."
- id: ats069-050-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: "Predict which build steps Docker reuses from its cache"
  source_readings:
  - sections/section-050/module-02/course-03-layers-and-the-build-cache.md
  prompt: "A Dockerfile copies the skeleton, installs dependencies, copies the bundle and unpacks it. Only a source file changes and the bundle is rebuilt. Which steps run again?"
  options:
  - id: a
    text: "Every step, including the base image pull."
    explanation: "Earlier steps with unchanged input are reused."
  - id: b
    text: "Only the unpack step."
    explanation: "The copy step runs first because its input changed, and the unpack depends on it."
  - id: c
    text: "The bundle copy and the steps after it."
    explanation: "Correct. A changed input invalidates its own step and every later step. The earlier steps stay cached."
  - id: d
    text: "None, because Docker compares only instruction text."
    explanation: "For `COPY`, Docker also compares the file content."
  correct_option: c
  explanation: "Correct. A changed input invalidates its own step and every later step. The earlier steps stay cached."
- id: ats069-050-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: "Predict which build steps Docker reuses from its cache"
  source_readings:
  - sections/section-050/module-02/course-03-layers-and-the-build-cache.md
  prompt: "Why does `COPY . .` before the dependency install slow down builds?"
  options:
  - id: a
    text: "Docker refuses to cache `COPY` instructions."
    explanation: "Docker caches `COPY` by file content."
  - id: b
    text: "The command copies files twice."
    explanation: "The number of copies is not the problem. The cache key is."
  - id: c
    text: "It changes the base image."
    explanation: "The base image is chosen by `FROM`."
  - id: d
    text: "Any changed file in the context changes the copied content, so the install step and all later steps run again."
    explanation: "Correct. Copying named files keeps the cache stable."
  correct_option: d
  explanation: "Correct. Copying named files keeps the cache stable."
- id: ats069-050-q19
  type: single_choice
  difficulty: advanced
  learning_objective: "Use BuildKit cache mounts and secret mounts for dependency downloads and credentials"
  source_readings:
  - sections/section-050/module-02/course-04-buildkit-cache-mounts-and-secret-mounts.md
  prompt: "A build needs a registry token for one `RUN` step. Which method keeps the token out of the image layers and the history?"
  options:
  - id: a
    text: "`RUN --mount=type=secret,id=...` with `--secret` on the build command."
    explanation: "Correct. The secret is readable only during that instruction and is not stored."
  - id: b
    text: "`ARG TOKEN` and `--build-arg`."
    explanation: "Build arguments are recorded in the image history."
  - id: c
    text: "`ENV TOKEN=...` in the Dockerfile."
    explanation: "`ENV` stores the value in the image metadata."
  - id: d
    text: "`COPY` of a token file, then `RUN rm` in a later instruction."
    explanation: "The file stays in the earlier layer."
  correct_option: a
  explanation: "Correct. The secret is readable only during that instruction and is not stored."
- id: ats069-050-q20
  type: single_choice
  difficulty: advanced
  learning_objective: "Use BuildKit cache mounts and secret mounts for dependency downloads and credentials"
  source_readings:
  - sections/section-050/module-02/course-04-buildkit-cache-mounts-and-secret-mounts.md
  prompt: "What is true of a `RUN --mount=type=cache` directory?"
  options:
  - id: a
    text: "It becomes part of the image and adds to its size."
    explanation: "The cache content is not stored in a layer."
  - id: b
    text: "Docker keeps it outside the image layers between builds, and the step must still work when it is empty."
    explanation: "Correct. A cache mount speeds up downloads but does not change the result."
  - id: c
    text: "It is shared with the final container at run time."
    explanation: "It exists only while the instruction runs."
  - id: d
    text: "It guarantees the install step is skipped."
    explanation: "The step still runs. Only the downloads can be reused."
  correct_option: b
  explanation: "Correct. A cache mount speeds up downloads but does not change the result."
- id: ats069-050-q21
  type: single_choice
  difficulty: beginner
  learning_objective: "Start, inspect and stop a container, and publish its port"
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: "What does `-p 8080:7007` do?"
  options:
  - id: a
    text: "It publishes container port 7007 on host port 8080."
    explanation: "Correct. The host port is on the left and the container port is on the right."
  - id: b
    text: "It publishes host port 7007 on container port 8080."
    explanation: "The sides are the other way around."
  - id: c
    text: "It makes the backend listen on port 8080."
    explanation: "The process chooses its own port. The option only maps it."
  - id: d
    text: "It limits the container to 8080 connections."
    explanation: "The option does not limit connections."
  correct_option: a
  explanation: "Correct. The host port is on the left and the container port is on the right."
- id: ats069-050-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: "Start, inspect and stop a container, and publish its port"
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: "A container publishes `-p 7007:7007`, but `curl` to the host port is refused. The log shows that the backend listens on `127.0.0.1:7007`. What is the cause?"
  options:
  - id: a
    text: "Port 7007 is reserved by Docker."
    explanation: "Docker does not reserve that port."
  - id: b
    text: "The process binds the loopback address inside the container, so published traffic cannot reach it."
    explanation: "Correct. The backend must bind `0.0.0.0`, which the production configuration sets."
  - id: c
    text: "The image has no layers."
    explanation: "Every image has layers. This is not the cause."
  - id: d
    text: "The container needs `--privileged`."
    explanation: "Privileges do not change the bind address."
  correct_option: b
  explanation: "Correct. The backend must bind `0.0.0.0`, which the production configuration sets."
- id: ats069-050-q23
  type: single_choice
  difficulty: beginner
  learning_objective: "Start, inspect and stop a container, and publish its port"
  source_readings:
  - sections/section-050/module-03/course-01-running-and-inspecting-a-container.md
  prompt: "Which command shows why a container exited a moment after it started?"
  options:
  - id: a
    text: "`docker image ls`"
    explanation: "That lists images, not container output."
  - id: b
    text: "`docker build --no-cache`"
    explanation: "That builds an image."
  - id: c
    text: "`docker logs <name>` together with `docker container ls -a`."
    explanation: "Correct. The log shows the last output, and the list shows the exit status of stopped containers."
  - id: d
    text: "`docker network ls`"
    explanation: "That lists networks."
  correct_option: c
  explanation: "Correct. The log shows the last output, and the list shows the exit status of stopped containers."
