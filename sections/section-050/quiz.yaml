  prompt: "A container runs with `--read-only` and the process fails when it writes a temporary file. What is the usual fix?"
  options:
  - id: a
    text: "Remove `USER node` from the Dockerfile."
    explanation: "Running as root does not address the read-only setting."
  - id: b
    text: "Add `--cap-add ALL`."
    explanation: "Capabilities do not make a read-only filesystem writable."
  - id: c
    text: "Publish another port."
    explanation: "Ports are not related to file writes."
  - id: d
    text: "Add `--tmpfs /tmp` so the process has a writable temporary directory."
    explanation: "Correct. The root filesystem stays read-only."
  correct_option: d
  explanation: "Correct. The root filesystem stays read-only."
