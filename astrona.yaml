# Course manifest for ATS069. Each section lists its README, module (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS069
  title: 'CBA: Backstage Development Workflow'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes covering every published objective in this CBA domain. Labs run on Ubuntu 24.04 QEMU virtual machines.
  certification:
    name: Certified Backstage Associate
    code: CBA
    provider: CNCF / Linux Foundation
    domain: Backstage Development Workflow
    weight: 24
    competencies:
    - Build and run Backstage projects locally
    - Understand local development workflows
    - Compile a Backstage project with TypeScript
    - Download and install dependencies for a Backstage project with NPM/Yarn
    - Use Docker to build a container image of a Backstage project
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
